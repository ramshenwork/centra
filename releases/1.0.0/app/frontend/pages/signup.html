<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CENTRA — Business Setup</title>
<style>
:root{--bg:#f4eee3;--paper:#fbf7ef;--paper2:#f6f0e5;--ink:#2d3021;--muted:#777363;--olive:#59652e;--olive2:#707b43;--line:#d8cbb7;--soft:#e7dfd0;--white:#fffdf8;--danger:#a64b3d;--good:#557046;--shadow:0 16px 50px #43391b12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 18% 0%,#fffaf1 0,transparent 36%),linear-gradient(160deg,#f5eee2,#eae3d3);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh}
button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9aa46b;outline-offset:2px}
.shell{width:min(100%,760px);margin:0 auto;padding:20px 18px 40px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.24em;font-family:Georgia,serif;font-size:22px}.brand-mark{width:32px;height:32px;border:2px solid var(--olive);border-right-color:transparent;border-radius:50%;position:relative;transform:rotate(-28deg)}.brand-mark:after{content:"";position:absolute;width:13px;height:8px;background:var(--olive);border-radius:100% 0 100% 0;right:-2px;bottom:3px;transform:rotate(-10deg)}.quiet{border:0;background:transparent;color:var(--muted);padding:8px 0}.quiet:hover{color:var(--olive);text-decoration:underline}.intro{text-align:center;margin:14px 0 24px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:10px;color:var(--olive);font-weight:800}.intro h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:clamp(27px,5vw,38px);line-height:1.12;margin:9px 0 8px;letter-spacing:-.035em}.intro p{color:var(--muted);margin:0 auto;max-width:440px;line-height:1.55;font-size:14px}.progress{display:grid;grid-template-columns:repeat(6,1fr);margin:0 0 22px;position:relative;gap:4px}.progress:before{content:"";position:absolute;height:1px;background:var(--line);left:8%;right:8%;top:15px;z-index:0}.step-indicator{position:relative;z-index:1;text-align:center;color:#8a8577;font-size:10px}.step-dot{width:31px;height:31px;border-radius:50%;border:1px solid #c6b69e;background:var(--paper);display:grid;place-items:center;margin:0 auto 7px;font-size:13px;color:#686351}.step-indicator.active .step-dot,.step-indicator.done .step-dot{background:var(--olive);color:white;border-color:var(--olive)}.step-indicator.active{color:var(--ink);font-weight:700}.card{background:#fffaf1d9;border:1px solid #fffdf8;border-radius:24px;padding:clamp(18px,4vw,30px);box-shadow:var(--shadow);backdrop-filter:blur(8px)}.step-meta{color:var(--muted);font-size:12px;margin-bottom:5px}.card h2{font-family:Georgia,serif;font-size:27px;font-weight:500;margin:0 0 7px;letter-spacing:-.025em}.subhead{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;min-width:0}.field.full{grid-column:1/-1}.field label,.label{font-size:12px;font-weight:700;color:#514f40}.field input,.field select,.field textarea,.inputlike{width:100%;border:1px solid var(--line);background:#fffaf2;border-radius:12px;padding:12px 13px;color:var(--ink);min-height:45px}.field input::placeholder,.field textarea::placeholder{color:#a49a89}.field small,.hint{font-size:11px;color:var(--muted);line-height:1.45}.password-wrap{position:relative}.password-wrap input{padding-right:66px}.toggle{position:absolute;right:8px;top:7px;border:0;background:transparent;color:var(--olive);font-size:11px;font-weight:700;padding:7px}.checkline{display:flex;align-items:flex-start;gap:10px;font-size:12px;line-height:1.5;color:#625e4e;margin:8px 0 16px}.checkline input{accent-color:var(--olive);margin-top:3px}.checkline a,.inline-link{color:var(--olive);font-weight:700}.actions{display:flex;gap:10px;margin-top:22px}.btn{border-radius:999px;border:1px solid transparent;padding:13px 19px;font-weight:750;font-size:13px;transition:transform .15s,background .15s;min-height:46px}.btn:active{transform:scale(.99)}.btn.primary{background:var(--olive);color:white;box-shadow:0 5px 14px #59652e1c}.btn.primary:hover{background:#465126}.btn.secondary{background:transparent;border-color:var(--line);color:var(--ink)}.btn.secondary:hover{background:#f2eadc}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.grow{flex:1}.center{text-align:center}.status{font-size:12px;margin:10px 0 0;line-height:1.5}.status.error{color:var(--danger)}.status.success{color:var(--good)}.pill{display:inline-flex;align-items:center;gap:6px;background:#e8e8d5;color:#525d2c;border-radius:999px;padding:6px 10px;font-size:10px;font-weight:800}.section-title{font-size:13px;font-weight:800;margin:22px 0 10px}.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.category{border:1px solid var(--line);background:#fffaf2;border-radius:14px;padding:12px 6px;text-align:center;color:var(--muted);font-size:11px;min-height:72px}.category span{display:block;font-size:20px;margin-bottom:6px}.category.selected{border-color:var(--olive);background:#eff0e1;color:var(--ink);box-shadow:inset 0 0 0 1px var(--olive)}.service-list{border:1px solid var(--line);border-radius:14px;overflow:hidden}.service-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #e9e0d2;font-size:12px}.service-row:last-child{border-bottom:0}.service-row input{accent-color:var(--olive)}.service-name{flex:1}.price-input{width:100px!important;min-height:34px!important;padding:7px 9px!important;border-radius:8px!important}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}.switch{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:700}.switch input{accent-color:var(--olive);width:17px;height:17px}.staff-card,.plan-card,.review-section{border:1px solid var(--line);background:#fffaf2;border-radius:16px;padding:15px;margin:12px 0}.staff-card-head,.plan-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.text-button{border:0;background:transparent;color:var(--olive);font-size:12px;font-weight:800;padding:6px}.days{display:flex;flex-wrap:wrap;gap:6px}.day{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 10px;font-size:10px;color:var(--muted)}.day.on{background:var(--olive);color:white;border-color:var(--olive)}.plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.plan-card{cursor:pointer;position:relative;margin:0}.plan-card.selected{border:2px solid var(--olive);background:#f1f1e4;padding:14px}.plan-card h3{margin:7px 0;font-family:Georgia,serif;font-size:22px;font-weight:500}.plan-card .price{font-size:21px;font-weight:800}.plan-card .old{color:var(--muted);text-decoration:line-through;font-size:11px}.plan-card ul{padding-left:17px;font-size:11px;color:var(--muted);line-height:1.8}.plan-card input{accent-color:var(--olive)}.segmented{display:flex;background:#eee5d6;border-radius:999px;padding:4px;gap:3px;margin:0 0 15px}.segmented button{flex:1;border:0;border-radius:999px;background:transparent;padding:9px;font-size:12px;color:var(--muted)}.segmented button.active{background:var(--olive);color:white}.notice{background:#efedda;border-radius:12px;padding:12px;color:#5b6037;font-size:11px;line-height:1.5;margin-top:12px}.review-section{margin:10px 0}.review-head{display:flex;justify-content:space-between;align-items:center}.review-head h3{font-size:13px;margin:0}.review-section p{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.6}.total{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:17px 0 3px}.total strong{font-size:22px}.hidden{display:none!important}.footer-note{text-align:center;font-size:10px;color:var(--muted);margin:16px 0 0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303322;color:#fffaf1;border-radius:999px;padding:12px 18px;font-size:12px;box-shadow:var(--shadow);z-index:5;max-width:90%;text-align:center}.modal-backdrop{position:fixed;inset:0;background:#24241966;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(100%,390px);background:var(--paper);border-radius:22px;padding:25px;box-shadow:0 20px 80px #0003}.otp-boxes{display:flex;gap:8px;margin:20px 0}.otp-boxes input{width:0;min-width:0;flex:1;text-align:center;padding:13px 0;border:1px solid var(--line);border-radius:10px;background:white;font-size:19px}.top-right{font-size:11px;color:var(--muted)}@media(max-width:520px){.shell{padding:15px 12px 28px}.topbar{margin-bottom:12px}.intro{margin:10px 0 20px}.progress{gap:0}.step-indicator{font-size:9px}.step-dot{width:28px;height:28px;margin-bottom:5px}.progress:before{top:13px}.card{border-radius:20px;padding:18px 15px}.grid{grid-template-columns:1fr;gap:0}.field.full{grid-column:auto}.category-grid{grid-template-columns:repeat(2,1fr)}.plan-grid{grid-template-columns:1fr}.actions .btn{padding:12px 13px}.intro p{font-size:13px}.card h2{font-size:25px}.brand{font-size:19px}}@media(min-width:650px){.shell{padding-top:28px}.intro{margin-top:24px}.card{padding:32px}.field input,.field select{min-height:48px}}
.svc-group{border:1px solid var(--line);border-radius:14px;background:var(--white);margin:10px 0;overflow:hidden}.svc-group summary{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 15px;cursor:pointer;font-weight:700;list-style:none}.svc-group summary::-webkit-details-marker{display:none}.svc-group summary:before{content:"▸";color:var(--olive);margin-right:8px;transition:transform .15s}.svc-group[open] summary:before{transform:rotate(90deg)}.svc-group summary>span:first-child{flex:1}.svc-count{font-size:12px;color:var(--muted);font-weight:500}.svc-group-tools{display:flex;justify-content:flex-end;padding:0 15px}.svc-group .service-list{padding:4px 12px 12px}.service-name{cursor:pointer}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <button class="quiet" id="backToStart" aria-label="Go back">← Back</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>CENTRA</span></div>
    <span class="top-right" id="savedLabel"></span>
  </header>
  <section class="intro">
    <div class="eyebrow">Your business, thoughtfully managed</div>
    <h1>Create your business account</h1>
    <p>Set up your business, start taking bookings, and manage everything in one place.</p>
  </section>
  <nav class="progress" aria-label="Signup progress" id="progress"></nav>
  <main class="card" id="mainCard"></main>
  <p class="footer-note">A calmer way to run your business · CENTRA</p>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script src="/static/scripts/api.js"></script>
<script>
const stepNames=["Owner","Business","Services","Staff","Plan","Review"];
let categories=[];let catalogLoaded=false;let PRICING=null;
function categoryOf(type){return categories.find(c=>c.types.includes(type))||{groups:[],openGroups:{}}}
function serviceCatalogFor(type){return categoryOf(type).groups.flatMap(g=>g.services)}
const serviceCatalog=new Proxy({},{get:(_,type)=>serviceCatalogFor(type)});
const state={
 step:0,verified:false,owner:{name:"",email:"",phone:"",password:"",confirm:"",terms:false},
 business:{category:"Automotive",type:"Car Detailing",name:"",slug:"",address:"",city:"",phone:"",whatsapp:"",areas:["","",""],days:["Mon","Tue","Wed","Thu","Fri","Sat"],open:"09:00",close:"19:00",logoName:""},
 services:{selected:[],open:{},showAll:false,showPricing:true,prices:{},custom:[],interval:"30",customInterval:""},
 staff:[],plan:"Base",billing:"monthly",metaVerified:"",paymentReady:false,logoUrl:""
};
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){$("#toastRoot").innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;setTimeout(()=>$("#toastRoot").innerHTML="",2800)}
function renderProgress(){ $("#progress").innerHTML=stepNames.map((n,i)=>`<div class="step-indicator ${i===state.step?"active":i<state.step?"done":""}"><div class="step-dot">${i<state.step?"✓":i+1}</div>${n}</div>`).join("");}
function field(label,key,placeholder,type="text",value,extra=""){return `<div class="field ${extra}"><label for="${key}">${label}</label><input id="${key}" name="${key}" type="${type}" placeholder="${placeholder}" value="${esc(value??"")}" data-bind="${key}"></div>`}
function selectField(label,key,options,value,extra=""){return `<div class="field ${extra}"><label for="${key}">${label}</label><select id="${key}" data-bind="${key}">${options.map(o=>`<option value="${esc(o.value)}" ${o.value===value?"selected":""}>${esc(o.label)}</option>`).join("")}</select></div>`}
function footerButtons(back=true,next="Continue"){return `<div class="actions">${back?'<button class="btn secondary" data-action="back">Back</button>':""}<button class="btn primary grow" data-action="next">${next} →</button></div>`}
function renderOwner(){return `<div class="step-meta">STEP 1 OF 6</div><h2>Owner account</h2><p class="subhead">First, let’s create the account you’ll use to manage CENTRA.</p>
<div class="grid">${field("Full name","owner.name","e.g. Ananya Rao","text",state.owner.name)}${field("Email address","owner.email","you@business.com","email",state.owner.email)}${field("Phone number (optional)","owner.phone","+91 98765 43210","tel",state.owner.phone)}
<div class="field"><label for="owner.password">Password</label><div class="password-wrap"><input id="owner.password" type="password" data-bind="owner.password" placeholder="Create a strong password" value="${esc(state.owner.password)}"><button class="toggle" data-action="togglePassword" data-target="owner.password">Show</button></div></div>
<div class="field full"><label for="owner.confirm">Confirm password</label><div class="password-wrap"><input id="owner.confirm" type="password" data-bind="owner.confirm" placeholder="Enter password again" value="${esc(state.owner.confirm)}"><button class="toggle" data-action="togglePassword" data-target="owner.confirm">Show</button></div><small>At least 8 characters, with letters, numbers and one special character.</small></div></div>
<label class="checkline"><input type="checkbox" data-bind="owner.terms" ${state.owner.terms?"checked":""}><span>I agree to the <a href="#" data-action="terms">Terms of Service</a> and <a href="#" data-action="privacy">Privacy Policy</a>.</span></label>
<div id="stepError" class="status error" aria-live="polite"></div><button class="btn primary grow" style="width:100%" data-action="sendOtp">Continue with email verification →</button>
<p class="center hint" style="margin-top:17px">Already have an account? <a class="inline-link" href="#" data-action="signin">Sign in</a></p>
`}
function renderOtp(){return `<div class="step-meta">EMAIL VERIFICATION</div><h2>Verify your email</h2><p class="subhead">Enter the six-digit code for <strong>${esc(state.owner.email)}</strong>. It expires in 10 minutes.</p><div class="otp-boxes">${[0,1,2,3,4,5].map(i=>`<input aria-label="OTP digit ${i+1}" inputmode="numeric" maxlength="1" class="otp-digit" data-otp="${i}">`).join("")}</div><div id="otpError" class="status error"></div><div class="actions"><button class="btn secondary" data-action="editOwner">Edit details</button><button class="btn primary grow" data-action="verifyOtp">Verify email →</button></div><p class="hint center">Didn't receive a code? <button class="text-button" data-action="resendOtp">Resend code</button></p>`}
function renderBusiness(){const b=state.business;return `<div class="step-meta">STEP 2 OF 6</div><h2>Tell us about your business</h2><p class="subhead">This information shapes your public booking page.</p><div class="section-title">Choose a business category</div><div class="category-grid">${categories.map(c=>`<button class="category ${b.category===c.name?"selected":""}" data-action="category" data-value="${esc(c.name)}"><span>${c.icon}</span>${esc(c.name)}</button>`).join("")}</div><div class="grid" style="margin-top:17px">${selectField("Business type","business.type",categories.find(c=>c.name===b.category).types.map(t=>({value:t,label:t})),b.type,"full")}${field("Business name","business.name","e.g. Olive Auto Studio","text",b.name,"full")}${field("Booking link name","business.slug","olive-auto-studio","text",b.slug)}<div class="field"><label>Booking address</label><div class="inputlike" id="slugPreview">${esc(location.host)}/${esc(b.slug||"your-business")}</div><small id="slugStatus">We check that this link is free.</small></div>${field("Street address","business.address","Building, street, area","text",b.address,"full")}${field("City","business.city","e.g. Hyderabad","text",b.city)}${areaFields(b)}${field("Business phone","business.phone","+91 phone number","tel",b.phone)}${field("WhatsApp number","business.whatsapp","+91 WhatsApp number","tel",b.whatsapp)}</div><div class="section-title">Working days</div><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<button class="day ${b.days.includes(d)?"on":""}" data-action="businessDay" data-value="${d}">${d}</button>`).join("")}</div><div class="grid" style="margin-top:15px">${selectField("Opening time","business.open",timeOptions(),b.open)}${selectField("Closing time","business.close",timeOptions(),b.close)}</div><div class="field"><label for="logo">Business logo (optional PNG)</label><input id="logo" type="file" accept="image/png"><small>PNG only, under 1 MB. A square image works best.</small>${state.logoUrl?`<div style="margin-top:8px"><img src="${esc(state.logoUrl)}" alt="Your logo" style="width:56px;height:56px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff"></div>`:""}</div><div id="stepError" class="status error"></div>${footerButtons()}`}
function areaLimit(){return (PRICING&&PRICING.search_areas_limit)||3}
function areaFields(b){if(!Array.isArray(b.areas))b.areas=[];while(b.areas.length<areaLimit())b.areas.push("");return `<div class="field full"><label>Areas where customers can find you</label><small>When customers ask an AI assistant for a business "near me in &lt;area&gt;", you show up for these. The first is where your business is.</small></div>`+b.areas.slice(0,areaLimit()).map((a,i)=>field(i===0?"Area 1: your area / locality (required)":`Area ${i+1}: nearby area (optional)`,`business.areas.${i}`,i===0?"e.g. Madhapur":"e.g. Hitech City","text",a)).join("")}
function timeOptions(){let a=[];for(let h=6;h<=23;h++){for(let m of [0,30]){if(h===23&&m===30)continue;let v=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");let ap=h<12?"AM":"PM",hh=h%12||12;a.push({value:v,label:`${hh}:${String(m).padStart(2,"0")} ${ap}`})}}return a}
function renderServices(){const s=state.services;const cat=categoryOf(state.business.type);
const preset=serviceCatalogFor(state.business.type);let all=[...preset,...s.custom];let selected=s.showAll?all:s.selected;
const defaults=(cat.openGroups||{})[state.business.type]||[];
const groups=[...cat.groups,...(s.custom.length?[{name:"Services you added",services:s.custom}]:[])];
const row=name=>`<div class="service-row"><input type="checkbox" id="svc-${esc(name)}" data-action="serviceToggle" data-value="${esc(name)}" ${selected.includes(name)?"checked":""}><label for="svc-${esc(name)}" class="service-name">${esc(name)}</label>${s.showPricing&&selected.includes(name)?`<input class="price-input" type="number" min="0" placeholder="₹ Price" aria-label="Price for ${esc(name)}" data-price="${esc(name)}" value="${esc(s.prices[name]||"")}">`:""}</div>`;
const grp=g=>{const n=g.services.filter(x=>selected.includes(x)).length;const open=s.open[g.name]??(defaults.includes(g.name)||n>0||g.name==="Services you added");
return `<details class="svc-group" data-group="${esc(g.name)}" ${open?"open":""}><summary><span>${esc(g.name)}</span><span class="svc-count">${n?n+" selected":g.services.length+" services"}</span></summary><div class="svc-group-tools"><button class="text-button" data-action="groupAll" data-value="${esc(g.name)}">${n===g.services.length?"Clear all":"Select all"}</button></div><div class="service-list">${g.services.map(row).join("")}</div></details>`};
return `<div class="step-meta">STEP 3 OF 6</div><h2>Services & availability</h2><p class="subhead">Tick every service you offer. Open a group to see its services. You can change these any time from your dashboard.</p><div class="toolbar"><span class="label">${esc(cat.name||"")} services · ${selected.length} selected</span><button class="text-button" data-action="toggleAll">${s.showAll?"Select individually":"Show all services"}</button></div>${groups.map(grp).join("")}<div class="actions"><button class="btn secondary" data-action="addService">＋ Add service</button></div><label class="checkline"><input type="checkbox" data-bind="services.showPricing" ${s.showPricing?"checked":""}><span><strong>Show pricing?</strong> Display prices beside services on your booking page.</span></label><div class="grid">${selectField("Default slot interval","services.interval",[{value:"15",label:"Every 15 minutes"},{value:"30",label:"Every 30 minutes"},{value:"60",label:"Every 1 hour"},{value:"custom",label:"Custom interval"}],s.interval)}${s.interval==="custom"?field("Custom interval (minutes)","services.customInterval","e.g. 45","number",s.customInterval):`<div class="field"><label>Availability rule</label><div class="inputlike">Service interval controls slots</div><small>Staff availability will filter the resulting slots.</small></div>`}</div><div id="stepError" class="status error"></div>${footerButtons()}`}
function renderStaff(){return `<div class="step-meta">STEP 4 OF 6 · OPTIONAL</div><h2>Meet your team</h2><p class="subhead">Add staff members and their availability. You can also skip this and manage a business-wide schedule.</p><div class="notice">If you add no staff, CENTRA uses the business working hours for booking availability.</div>${state.staff.map((st,i)=>`<div class="staff-card"><div class="staff-card-head"><strong>Staff member ${i+1}</strong><button class="text-button" data-action="removeStaff" data-index="${i}">Remove</button></div><div class="grid" style="margin-top:12px">${field("Name",`staff.${i}.name`,"Full name","text",st.name)}${field("Role",`staff.${i}.role`,"e.g. Stylist","text",st.role)}</div><div class="section-title">Working days</div><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<button class="day ${st.days.includes(d)?"on":""}" data-action="staffDay" data-index="${i}" data-value="${d}">${d}</button>`).join("")}</div><div class="grid" style="margin-top:12px">${selectField("Start time",`staff.${i}.start`,timeOptions(),st.start)}${selectField("End time",`staff.${i}.end`,timeOptions(),st.end)}${selectField("Break (optional)",`staff.${i}.break`,[{value:"none",label:"No break"},{value:"12:00-13:00",label:"12 PM – 1 PM"},{value:"13:00-14:00",label:"1 PM – 2 PM"},{value:"custom",label:"Custom break"}],st.break)}${selectField("Slot interval",`staff.${i}.interval`,[{value:"15",label:"15 minutes"},{value:"30",label:"30 minutes"},{value:"60",label:"1 hour"},{value:"custom",label:"Custom timings"}],st.interval)}</div></div>`).join("")}<button class="btn secondary" data-action="addStaff">＋ Add staff member</button><div class="hint" style="margin-top:12px">Service interval determines candidate slots; staff schedules, breaks and bookings filter availability.</div>${footerButtons(true,state.staff.length?"Continue":"Skip & continue")}`}
function planPrice(plan,billing){const p=PRICING&&PRICING.plans[plan]&&PRICING.plans[plan][billing];return p||{amount:0,months:billing==="pack"?6:1,free_months:0}}
function renderPlan(){let top=state.plan==="Top";let monthly=state.billing==="monthly";const p=planPrice(state.plan,state.billing);
return `<div class="step-meta">STEP 5 OF 6</div><h2>Choose your plan</h2><p class="subhead">Start with what your business needs. Your plan can be changed later.</p><div class="segmented"><button class="${monthly?"active":""}" data-action="billing" data-value="monthly">Monthly</button><button class="${!monthly?"active":""}" data-action="billing" data-value="pack">6-month pack</button></div><div class="plan-grid">${planCard("Base","Online booking website","Business dashboard","Services, staff & scheduling","Bookings and customer management")}${planCard("Top","Everything in Base","WhatsApp AI receptionist*","Knowledge & approvals","Priority support")}</div><div class="notice">${esc(PRICING?PRICING.offer_label:"")}. Prices are for your first ${monthly?"month":"6 months"}.${(planPrice("Top",state.billing).free_months)?" First-time Top subscribers get 1 extra month free.":""}</div>${top?`<div class="staff-card"><strong>WhatsApp eligibility</strong><p class="hint">The WhatsApp receptionist is available only for Meta-verified businesses.</p><div class="checkline"><label><input type="radio" name="meta" value="yes" ${state.metaVerified==="yes"?"checked":""} data-action="meta"> Yes, we are Meta-verified</label></div><div class="checkline"><label><input type="radio" name="meta" value="no" ${state.metaVerified==="no"?"checked":""} data-action="meta"> Not yet</label></div><p class="hint">If you're not Meta-verified yet, you'll be switched to Base and won't be charged for Top.</p></div>`:""}<div class="total"><span>${monthly?"Monthly":"6-month pack"} price</span><span><strong>₹${Number(p.amount).toLocaleString("en-IN")}</strong>${p.free_months?` <span class="hint">+ ${p.free_months} month free</span>`:""}</span></div><div id="stepError" class="status error"></div>${footerButtons()}`}
function planCard(name,...features){let selected=state.plan===name;const p=planPrice(name,state.billing);
return `<div class="plan-card ${selected?"selected":""}" data-action="choosePlan" data-value="${name}"><div class="plan-head"><span class="pill">${name==="Top"?"WITH WHATSAPP":"ESSENTIALS"}</span><input type="radio" name="plan" ${selected?"checked":""} aria-label="${name} plan"></div><h3>${name}</h3><div class="price">₹${Number(p.amount).toLocaleString("en-IN")}<span style="font-size:11px;font-weight:500;color:var(--muted)"> / ${state.billing==="monthly"?"month":"6 months"}</span></div><div class="old">${esc(PRICING?PRICING.offer_label:"")}</div><ul>${features.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>${p.free_months?'<small class="hint">+ 1 month free for first-time Top subscribers</small>':""}</div>`}
function renderReview(){let s=state.services,all=[...serviceCatalogFor(state.business.type),...s.custom],selected=s.showAll?all:s.selected;const p=planPrice(state.plan,state.billing);
return `<div class="step-meta">STEP 6 OF 6</div><h2>Review & pay</h2><p class="subhead">Take a final look. You can edit any section before continuing to payment.</p>${reviewSection("Owner account",`<strong>${esc(state.owner.name)}</strong><br>${esc(state.owner.email)}${state.owner.phone?"<br>"+esc(state.owner.phone):""}`,null)}${reviewSection("Business details",`${esc(state.business.name)}<br>${esc(state.business.type)} · ${esc(state.business.city)}<br>Areas: ${esc((state.business.areas||[]).filter(a=>a&&a.trim()).join(", ")||"—")}<br>${esc(location.host)}/${esc(state.business.slug||"your-business")}<br>${esc(state.business.days.join(", "))} · ${esc(state.business.open)}–${esc(state.business.close)}`,1)}${reviewSection("Services",`${selected.length} services · ${s.showPricing?"Pricing shown":"Pricing hidden"}<br>Slot interval: ${s.interval==="custom"?esc(s.customInterval)+" minutes":esc(s.interval)+" minutes"}<br>${selected.map(esc).join(", ")}`,2)}${reviewSection("Staff",state.staff.length?`${state.staff.length} staff member(s): ${state.staff.map(x=>esc(x.name||"Unnamed")).join(", ")}`:"No staff added · business-wide availability",3)}${reviewSection("Plan",`${state.plan} · ${state.billing==="monthly"?"Monthly":"6-month pack"}${p.free_months?" · +1 month free":""}<br>${state.plan==="Top"?"WhatsApp setup is done with you after payment":"Online booking and business management"}`,4)}<div class="review-section"><div class="total"><span>Due today</span><strong>₹${Number(p.amount).toLocaleString("en-IN")}</strong></div><p class="hint">Your booking page goes live as soon as the payment is confirmed.</p></div><label class="checkline"><input type="checkbox" data-bind="paymentReady" ${state.paymentReady?"checked":""}><span>I confirm these details are correct and agree to proceed to secure payment.</span></label><div id="stepError" class="status error"></div><div class="actions"><button class="btn secondary" data-action="back">Back</button><button class="btn primary grow" data-action="pay" id="payBtn">Continue to payment →</button></div>`}
function reviewSection(title,body,step){return `<div class="review-section"><div class="review-head"><h3>${title}</h3>${step===null?"":`<button class="text-button" data-action="editStep" data-value="${step}">Edit</button>`}</div><p>${body}</p></div>`}
function render(){renderProgress();let html=state.step===0?renderOwner():state.step===1?renderBusiness():state.step===2?renderServices():state.step===3?renderStaff():state.step===4?renderPlan():renderReview();$("#mainCard").innerHTML=html;$("#backToStart").style.visibility=state.step===0?"hidden":"visible";if(state.step===1){const type=$("#business\\.type");if(type)type.value=state.business.type;}}
function getPath(path){return path.split(".").reduce((o,k)=>o?.[k],state)}
function setPath(path,val){let parts=path.split("."),o=state;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts.at(-1)]=val}
function validOwner(){let o=state.owner;let email=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email.trim().toLowerCase());let pass=/^(?=.*[A-Za-z])(?=.*\d)(?=.*[^A-Za-z\d]).{8,}$/.test(o.password);if(!o.name.trim())return"Enter your full name.";if(!email)return"Enter a valid email address.";if(o.phone.trim()&&!/^[+\d][\d\s-]{9,15}$/.test(o.phone.trim()))return"Enter a valid phone number, or leave it empty.";if(!pass)return"Password must be at least 8 characters and include letters, numbers and a special character.";if(o.password!==o.confirm)return"Your passwords do not match.";if(!o.terms)return"Please accept the Terms of Service and Privacy Policy.";return""}
function validateStep(){if(state.step===0)return validOwner();if(state.step===1){let b=state.business;if(!b.name.trim())return"Enter your business name.";if(!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(b.slug))return"Use a URL slug with lowercase letters, numbers and hyphens.";if(!b.city.trim())return"Enter your city.";if(!(b.areas||[]).some(a=>a&&a.trim()))return"Enter your area / locality (Area 1), e.g. Madhapur.";if(!b.phone.trim())return"Enter the business phone number.";if(b.open>=b.close)return"Closing time must be later than opening time."}if(state.step===2){let all=[...(serviceCatalog[state.business.type]||[]),...state.services.custom];let chosen=state.services.showAll?all:state.services.selected;if(!chosen.length)return"Select at least one service.";if(state.services.interval==="custom"&&(+state.services.customInterval<5||!state.services.customInterval))return"Enter a custom slot interval of at least 5 minutes."}if(state.step===4&&state.plan==="Top"&&!state.metaVerified)return"Please tell us whether your business is Meta-verified.";return""}
function next(){let err=validateStep();let box=$("#stepError");if(err){if(box)box.textContent=err;else toast(err);return}
if(state.step===0&&!state.verified){sendOtp();return}
if(state.step===1&&state.slugTaken){if(box)box.textContent="That booking link is already taken. Please choose another.";return}
if(state.step<5){state.step++;render();saveDraft();window.scrollTo({top:0,behavior:"smooth"})}}
let saveTimer=null;
function draftState(){const {owner,verified,paymentReady,step,...rest}=state;return JSON.parse(JSON.stringify(rest))}
function saveDraft(){if(!state.verified)return;clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{
 $("#savedLabel").textContent="Saving…";
 try{await Centra.put("/api/signup/draft",{step:typeof state.step==="number"?state.step:1,state:draftState()});$("#savedLabel").textContent="Saved"}
 catch(e){$("#savedLabel").textContent="Not saved";if(e.status===401){toast("Your session ended. Please sign in again.");setTimeout(()=>location.href="/",1500)}}},400)}
async function sendOtp(){let err=validOwner();if(err){let box=$("#stepError");if(box)box.textContent=err;else toast(err);return}
 const btn=document.querySelector('[data-action="sendOtp"]');if(btn)btn.disabled=true;
 try{await Centra.post("/api/signup/start",{name:state.owner.name,email:state.owner.email,phone:state.owner.phone,password:state.owner.password,confirm:state.owner.confirm,terms:!!state.owner.terms})}
 catch(e){let box=$("#stepError");if(box)box.innerHTML=esc(e.message)+(e.code==="email_exists"?' <a class="inline-link" href="/">Sign in</a> · <a class="inline-link" href="/forgot-password">Reset password</a>':"");if(btn)btn.disabled=false;return}
 state.step="otp";renderProgress();$("#mainCard").innerHTML=renderOtp();$("#backToStart").style.visibility="visible";document.querySelector(".otp-digit")?.focus();toast("We emailed you a 6-digit code.")}
async function verifyOtp(){let code=[...document.querySelectorAll(".otp-digit")].map(x=>x.value).join("");let e=$("#otpError");
 if(code.length!==6){if(e)e.textContent="Enter all 6 digits.";return}
 try{const r=await Centra.post("/api/signup/verify",{email:state.owner.email,code});
  state.verified=true;state.owner.password="";state.owner.confirm="";state.step=1;render();saveDraft();toast("Email verified. Your progress is now saved.")}
 catch(err){if(e)e.textContent=err.message}}
function addStaff(){state.staff.push({name:"",role:"",days:["Mon","Tue","Wed","Thu","Fri"],start:state.business.open||"09:00",end:state.business.close||"19:00",break:"12:00-13:00",interval:"30"});render();saveDraft()}
function addService(){let name=prompt("Enter a service name:");if(!name||!name.trim())return;name=name.trim().slice(0,120);
 if(!serviceCatalogFor(state.business.type).includes(name)&&!state.services.custom.includes(name))state.services.custom.push(name);
 if(!state.services.selected.includes(name))state.services.selected.push(name);render();saveDraft()}
let slugTimer=null;
function checkSlug(){clearTimeout(slugTimer);const slug=state.business.slug;const out=$("#slugStatus");
 if(!slug){state.slugTaken=false;if(out)out.textContent="We check that this link is free.";return}
 slugTimer=setTimeout(async()=>{try{const r=await Centra.get("/api/signup/slug-available?slug="+encodeURIComponent(slug));state.slugTaken=!r.available;
  const o=$("#slugStatus");if(o){o.textContent=r.available?"✓ This link is available.":r.message;o.style.color=r.available?"var(--good)":"var(--danger)"}}catch(e){}},350)}
async function pay(){if(!state.paymentReady){$("#stepError").textContent="Please confirm your details before continuing.";return}
 const btn=$("#payBtn");btn.disabled=true;btn.textContent="Preparing payment…";$("#stepError").textContent="";
 try{const r=await Centra.post("/api/signup/checkout",{state:draftState()});
  btn.textContent="Waiting for payment…";
  await Centra.pay(r.order,{name:state.owner.name,email:state.owner.email,contact:state.owner.phone||state.business.phone});
  $("#mainCard").innerHTML=`<div class="center"><div class="eyebrow">Payment confirmed</div><h2 style="margin-top:12px">Your booking page is live</h2><p class="subhead">Taking you to your dashboard…</p></div>`;
  $("#progress").innerHTML=stepNames.map((n,i)=>`<div class="step-indicator done"><div class="step-dot">✓</div>${n}</div>`).join("");
  setTimeout(()=>location.href="/dashboard",1200);return}
 catch(e){if(e.code==="top_requires_meta"){state.plan="Base";state.metaVerified="";state.step=4;render();saveDraft();toast(e.message);return}
  if(e.code==="slug_taken"){state.step=1;render();setTimeout(()=>{const b=$("#stepError");if(b)b.textContent=e.message},0);return}
  $("#stepError").textContent=e.code==="dismissed"?"Payment wasn't completed. You can try again.":e.message}
 btn.disabled=false;btn.textContent="Continue to payment →"}
function handleAction(el){let a=el.dataset.action,v=el.dataset.value;switch(a){
case"next":next();break;
case"back":if(state.step>1||(state.step===1&&!state.verified)){state.step--;render();saveDraft()}break;
case"sendOtp":sendOtp();break;
case"verifyOtp":verifyOtp();break;
case"editOwner":state.step=0;render();break;
case"resendOtp":Centra.post("/api/signup/resend",{email:state.owner.email}).then(()=>toast("A new code is on its way."),e=>toast(e.message));break;
case"togglePassword":{let x=$("#"+CSS.escape(el.dataset.target));x.type=x.type==="password"?"text":"password";el.textContent=x.type==="password"?"Show":"Hide";break}
case"signin":location.href="/";break;
case"terms":case"privacy":window.open("/terms","_blank");break;
case"category":{const c=categories.find(c=>c.name===v);state.business.category=v;state.business.type=c.types[0];state.services.selected=[];state.services.custom=[];state.services.showAll=false;state.services.open={};render();saveDraft();break}
case"businessDay":state.business.days=state.business.days.includes(v)?state.business.days.filter(d=>d!==v):[...state.business.days,v];render();break;
case"toggleAll":state.services.showAll=!state.services.showAll;if(state.services.showAll)state.services.selected=[...serviceCatalogFor(state.business.type),...state.services.custom];render();saveDraft();break;
case"serviceToggle":{let n=v;state.services.selected=state.services.selected.includes(n)?state.services.selected.filter(x=>x!==n):[...state.services.selected,n];state.services.showAll=false;render();saveDraft();break}
case"groupAll":{const g=[...categoryOf(state.business.type).groups,{name:"Services you added",services:state.services.custom}].find(g=>g.name===v);if(!g)break;
 const all=g.services.every(x=>state.services.selected.includes(x));state.services.selected=all?state.services.selected.filter(x=>!g.services.includes(x)):[...new Set([...state.services.selected,...g.services])];
 state.services.open[v]=true;state.services.showAll=false;render();saveDraft();break}
case"addService":addService();break;
case"addStaff":addStaff();break;
case"removeStaff":state.staff.splice(+el.dataset.index,1);render();saveDraft();break;
case"staffDay":{let st=state.staff[+el.dataset.index];st.days=st.days.includes(v)?st.days.filter(d=>d!==v):[...st.days,v];render();break}
case"billing":state.billing=v;render();saveDraft();break;
case"choosePlan":state.plan=v;if(v==="Base")state.metaVerified="";render();saveDraft();break;
case"editStep":state.step=+v;render();break;
case"pay":pay();break;
}}
document.addEventListener("click",e=>{if(e.target.closest("summary"))return;let el=e.target.closest("[data-action]");if(!el||el.matches('input[type="checkbox"],input[type="radio"]'))return;e.preventDefault();handleAction(el)});
document.addEventListener("toggle",e=>{const d=e.target;if(d.matches&&d.matches("details.svc-group"))state.services.open[d.dataset.group]=d.open},true);
document.addEventListener("input",e=>{let el=e.target;if(el.dataset.bind){let val=el.type==="checkbox"?el.checked:el.value;setPath(el.dataset.bind,val);
 if(el.dataset.bind==="business.slug"){state.business.slug=val.toLowerCase().trim().replace(/[^a-z0-9-]+/g,"-").replace(/-+/g,"-");let p=$("#slugPreview");if(p)p.textContent=location.host+"/"+(state.business.slug||"your-business");checkSlug()}}
 if(el.dataset.price)state.services.prices[el.dataset.price]=el.value;
 if(el.matches(".otp-digit")){el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value){let n=el.parentElement.querySelector(`[data-otp="${+el.dataset.otp+1}"]`);n?.focus()}}});
document.addEventListener("paste",e=>{const el=e.target;if(!el.matches||!el.matches(".otp-digit"))return;const t=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,6);if(t.length<2)return;e.preventDefault();document.querySelectorAll(".otp-digit").forEach((x,i)=>x.value=t[i]||"")});
document.addEventListener("change",async e=>{let el=e.target;
 if(el.dataset.action==="serviceToggle"){handleAction(el);return}
 if(el.dataset.action==="meta"){state.metaVerified=el.value;if(el.value==="no"){state.plan="Base";state.metaVerified="";render();toast("Top needs a Meta-verified business, so you've been switched to Base. You won't be charged for Top.")}saveDraft();return}
 if(el.dataset.bind){let val=el.type==="checkbox"?el.checked:el.value;setPath(el.dataset.bind,val);
  if(el.dataset.bind==="business.type"){state.services.selected=[];state.services.custom=[];state.services.showAll=false;state.services.open={};render()}
  if(el.dataset.bind==="services.showPricing"||el.dataset.bind==="services.interval"||el.dataset.bind==="paymentReady"||el.dataset.bind.startsWith("staff."))render();
  saveDraft()}
 if(el.dataset.price){state.services.prices[el.dataset.price]=el.value;saveDraft()}
 if(el.id==="logo"&&el.files?.[0]){const f=el.files[0];if(f.type!=="image/png"){toast("Please choose a PNG image.");el.value="";return}
  if(f.size>1000000){toast("The logo must be smaller than 1 MB.");el.value="";return}
  try{const r=await Centra.upload("/api/signup/logo",f);state.logoUrl=r.logo_url;state.business.logoName=f.name;render();toast("Logo uploaded")}catch(err){toast(err.message)}}});
$("#backToStart").addEventListener("click",()=>{if(state.step==="otp")state.step=0;else if(state.step>1||(state.step===1&&!state.verified))state.step--;else{location.href="/";return}render()});
(async function init(){
 $("#savedLabel").textContent="";
 try{const [cat,pr]=await Promise.all([Centra.get("/api/signup/catalog"),Centra.get("/api/signup/pricing")]);categories=cat.categories;PRICING=pr;catalogLoaded=true;
  if(!categories.some(c=>c.name===state.business.category)){state.business.category=categories[0].name;state.business.type=categories[0].types[0]}}
 catch(e){$("#mainCard").innerHTML=`<div class="status error">${esc(e.message)}</div>`;return}
 try{const ss=await Centra.get("/api/auth/session");if(!ss.signed_in)throw 0;const d=await Centra.get("/api/signup/draft");
  if(d.redirect){location.href=d.redirect;return}
  state.verified=true;state.owner={...state.owner,...d.owner,password:"",confirm:"",terms:true};state.logoUrl=d.logo_url||"";
  if(d.draft&&d.draft.state){const ds=d.draft.state;Object.assign(state.business,ds.business||{});Object.assign(state.services,ds.services||{});
   state.staff=ds.staff||[];state.plan=ds.plan||"Base";state.billing=ds.billing||"monthly";state.metaVerified=ds.metaVerified||"";state.step=Math.min(Math.max(d.draft.step||1,1),5)}
  else state.step=1;
  $("#savedLabel").textContent="Saved";
 }catch(e){/* not signed in yet: start at step 1 (owner account) */}
 render();if(state.step===1)checkSlug();
})();

</script>
</body>
