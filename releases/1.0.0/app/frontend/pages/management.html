<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CENTRA Management</title>
<style>
:root{--bg:#f2ebdf;--paper:#fffaf1;--ink:#303123;--muted:#7b7767;--olive:#59652e;--line:#ded1bd;--soft:#e9e3d0;--red:#a94c3f;--green:#4e7043}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#fffaf1,transparent 40%),linear-gradient(145deg,#f4eee3,#e9e1d1);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9b27c;outline-offset:2px}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:#f8f2e8d9;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;font:22px Georgia,serif;letter-spacing:.25em}.mark{width:29px;height:29px;border:2px solid var(--olive);border-right-color:transparent;border-radius:50%;transform:rotate(-25deg)}.biz{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--paper);font-size:12px}.biz small{display:block;color:var(--muted);margin-top:4px}.navlabel{font-size:9px;color:#928a78;letter-spacing:.15em;font-weight:800;padding:0 10px;margin-bottom:7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#686655;text-align:left;padding:11px;border-radius:11px;font-size:12px}.nav button:hover{background:#efeadc}.nav button.active{background:var(--olive);color:white}.main{min-width:0}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#f8f2e8aa;position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}.crumb{font-size:11px;color:var(--muted)}.topright{display:flex;align-items:center;gap:10px}.iconbtn{position:relative;border:1px solid var(--line);border-radius:50%;width:37px;height:37px;background:var(--paper)}.badge{position:absolute;right:-2px;top:-3px;background:var(--red);color:white;border-radius:20px;padding:2px 5px;font-size:9px}.content{max-width:1450px;margin:auto;padding:28px 30px 45px}.head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:22px}.eyebrow{font-size:9px;letter-spacing:.16em;color:var(--olive);font-weight:800}h1{font:500 clamp(27px,3vw,36px)/1.12 Georgia,serif;letter-spacing:-.03em;margin:8px 0}.lead{font-size:12px;color:var(--muted);line-height:1.6;margin:0}.btn{border:1px solid transparent;border-radius:99px;padding:10px 15px;font-size:11px;font-weight:800;min-height:36px}.primary{background:var(--olive);color:white}.secondary{background:var(--paper);border-color:var(--line);color:var(--ink)}.danger{background:#f7e8e2;color:var(--red);border-color:#ebcfc5}.small{padding:6px 9px;min-height:28px;font-size:10px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:17px}.stat,.panel,.tile{border:1px solid #fffdf8;background:#fffaf1dc;border-radius:18px;box-shadow:0 12px 35px #4137190d;padding:17px;min-width:0}.statlabel{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.statvalue{font:500 30px Georgia,serif;margin:11px 0 5px}.muted{color:var(--muted);font-size:10px}.cols{grid-template-columns:minmax(0,1.2fr) minmax(270px,.8fr)}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.panel h2{font:500 21px Georgia,serif;margin:0}.panelhead p{font-size:10px;color:var(--muted);margin:5px 0}.linkbox{display:flex;gap:9px;align-items:center;border:1px solid var(--line);background:#f8f2e8;border-radius:12px;padding:10px}.linkurl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}.apptlist{display:grid;gap:8px}.appt{display:grid;grid-template-columns:60px 1fr auto;align-items:center;gap:10px;border:1px solid #e9dfcf;background:#fffaf4;border-radius:12px;padding:11px}.time{font-size:11px;font-weight:800;color:var(--olive)}.appt strong{font-size:11px}.appt small{display:block;font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.status{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:800;background:#ece8d7;color:#59602f;white-space:nowrap}.confirmed,.completed{background:#e4eddc;color:#41653c}.requested,.awaiting-payment{background:#fff0d7;color:#966116}.cancelled,.no-show,.rejected{background:#f6e3de;color:#9e4438}.alert{display:flex;gap:12px;align-items:center;background:#f8edcf;border:1px solid #e9dcb7;border-radius:13px;padding:13px;margin:13px 0;font-size:11px}.quick{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}.tile{display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink);cursor:pointer}.tile:hover{border-color:var(--olive)}.tileicon{width:37px;height:37px;flex-shrink:0;border-radius:50%;background:#e7e5d0;color:var(--olive);display:grid;place-items:center;font-size:17px}.tile strong{display:block;font:500 16px Georgia,serif}.tile small{font-size:10px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.tabs,.filters{display:flex;gap:6px;flex-wrap:wrap}.tabs{background:#eee7d9;padding:4px;border-radius:99px}.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:99px;color:var(--muted);font-size:10px}.tabs button.active{background:var(--olive);color:white}input,select,textarea{border:1px solid var(--line);background:#fffaf3;border-radius:10px;padding:10px;color:var(--ink);font-size:11px;min-height:36px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;font-weight:800}.field input,.field select,.field textarea{width:100%}.full{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid #e7ddcd;border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:680px;background:#fffaf4}.table th{text-align:left;background:#f0eadc;color:#77705e;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:12px}.table td{padding:12px;border-top:1px solid #eee5d7;font-size:11px}.table td small{display:block;color:var(--muted);margin-top:4px}.itemrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e9dfcf}.itemrow:last-child{border:0}.itemicon{width:40px;height:40px;border-radius:12px;background:#e7e4d0;display:grid;place-items:center;font-size:19px;flex-shrink:0}.itemmain{flex:1;min-width:0}.itemmain strong{font-size:12px}.itemmain small{display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.itemend{text-align:right;font-size:12px;font-weight:800}.itemend small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.switch{border:0;background:#c8c1b2;width:35px;height:20px;border-radius:99px;padding:3px}.switch:after{content:"";display:block;background:white;width:14px;height:14px;border-radius:50%}.switch.on{background:var(--olive)}.switch.on:after{transform:translateX(15px)}.plan{border:1px solid var(--line);background:#fffaf3;border-radius:15px;padding:17px}.plan.selected{border:2px solid var(--olive);background:#f1f0e3}.price{font:500 28px Georgia,serif;margin:12px 0}.chart{height:170px;display:flex;align-items:end;gap:13px;border-bottom:1px solid var(--line);padding:20px 8px 0}.barwrap{height:100%;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:7px;flex:1}.bar{width:30px;max-width:70%;background:linear-gradient(#929969,#59652e);border-radius:7px 7px 0 0}.barwrap span{font-size:9px;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#efedda;color:#5b6037;font-size:11px;line-height:1.5;margin:12px 0}.hidden{display:none!important}.modalbg{position:fixed;inset:0;background:#26261977;z-index:10;display:grid;place-items:center;padding:16px}.modal{width:min(100%,520px);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;padding:22px;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{font:500 24px Georgia,serif;margin:0}.close{border:0;border-radius:50%;width:30px;height:30px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303322;color:white;border-radius:99px;padding:12px 17px;font-size:11px;z-index:20}.bottomnav{display:none}.days{display:flex;gap:5px;flex-wrap:wrap}.day{border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:transparent;font-size:10px}.day.on{background:var(--olive);color:white}.logoimg{width:66px;height:66px;object-fit:cover;border-radius:15px}@media(max-width:900px){.app{grid-template-columns:70px 1fr}.side{padding:16px 7px}.brand{font-size:0}.biz{font-size:0;text-align:center;padding:10px}.biz small{display:none}.navlabel,.nav button span:last-child{display:none}.nav button{text-align:center;padding:12px 3px;font-size:17px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{display:block;padding-bottom:68px}.side{display:none}.top{height:60px;padding:0 13px}.content{padding:20px 12px 28px}.head{align-items:center}.head .lead{max-width:240px}.stats{gap:9px}.stat{padding:13px}.statvalue{font-size:27px}.panel{padding:14px}.appt{grid-template-columns:53px 1fr;gap:8px}.appt>.status{grid-column:2;justify-self:start}.quick{gap:8px}.tile{padding:11px;gap:8px}.tileicon{width:30px;height:30px}.tile strong{font-size:14px}.tile small{font-size:9px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#faf4e9;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px}.bottomnav button{border:0;background:transparent;color:var(--muted);font-size:9px;display:grid;gap:3px;justify-items:center}.bottomnav button.active{color:var(--olive);font-weight:800}.bottomnav span{font-size:17px}.table{min-width:700px}.head .btn{padding:8px 10px}.ownerlabel{display:none}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><span class="mark"></span>CENTRA</div><div class="biz">🚘 <b id="sideBiz"></b><small id="sideCity"></small></div><div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"></nav></div><div style="margin-top:auto"><div class="navlabel">ACCOUNT</div><nav class="nav" id="accountNav"></nav></div></aside>
<main class="main"><header class="top"><div class="crumb" id="crumb">Business management / Dashboard</div><div class="topright"><button class="iconbtn" id="sound" title="Toggle sound">♫</button><button class="iconbtn" id="bell" title="Notifications">♧<span class="badge hidden" id="badge">0</span></button><span class="ownerlabel"></span></div></header><div class="content" id="view"></div></main></div><nav class="bottomnav" id="bottomnav"></nav><div id="modal"></div><div id="toast"></div>
<script src="/static/scripts/api.js"></script>
<script>
const navItems=[["home","⌂","Dashboard"],["appointments","▦","Appointments"],["services","✧","Services"],["staff","♙","Staff"],["customers","♧","Customers"],["payments","₹","Payments"],["reports","▥","Reports"],["closures","◷","Business closures"],["profile","◇","Business profile"],["subscription","♕","Subscription"],["notifications","♧","Notifications"]];
const statuses=["Awaiting payment","Requested","Confirmed","Completed","Cancelled","Rejected","Expired","No-show","Refunded","Deposit forfeited"];
const state={page:"home",view:"list",filter:"All statuses",query:"",nfilter:"All",calMonth:null,loaded:false,business:{name:"",city:"",address:"",phone:"",slug:"",days:[],open:"09:00",close:"19:00",showPricing:true,logo:""},services:[],staff:[],appointments:[],customers:[],closures:[],festivals:[],festivalWarnings:[],notifications:[],deposits:false,depositPercent:10,refundWindow:"24",plan:"Base",billing:"Monthly",renewal:"",billingHistory:[],sound:true,payments:{total:0,held:0,refunds:0,payouts:0,recent:[]},reports:{bookings:0,cancellations:0,noShows:0,completed:0,busiest:[],topServices:[]},owner:{name:""},bookingUrl:"",today:"",lastNotificationId:0};
async function reload(){try{const d=await Centra.get("/api/dashboard/state");Object.assign(state,d,{loaded:true});render()}catch(e){if(e.status===401){location.href="/";return}if(e.code==="signup_incomplete"){location.href="/signup";return}toast(e.message)}}
async function call(p,msg){try{const r=await p;if(msg)toast(msg);await reload();return r}catch(e){toast(e.message);throw e}}
const fmtDate=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";
const t12=t=>{if(!t)return"";let[h,m]=t.split(":").map(Number);return`${String(h%12||12).padStart(2,"0")}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`};

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){$("#toast").innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$("#toast").innerHTML="",2500)}function money(n){return"₹"+Number(n||0).toLocaleString("en-IN")}function suspended(o){return o.suspend==="forever"||!!(o.suspend&&new Date(o.suspend+"T23:59:59")>new Date())}function badge(s){return`<span class="status ${s.toLowerCase().replaceAll(" ","-")}">${esc(s)}</span>`}function unread(){return state.notifications.filter(n=>n.unread).length}
function nav(){let mk=items=>items.map(([id,ico,n])=>`<button class="${state.page===id?"active":""}" data-page="${id}">${ico} <span>${n}</span></button>`).join("");$("#nav").innerHTML=mk(navItems.slice(0,7));$("#accountNav").innerHTML=mk(navItems.slice(7))+`<button data-act="signout">⇥ <span>Sign out</span></button>`;$("#bottomnav").innerHTML=navItems.slice(0,5).concat([navItems[9]]).map(([id,ico,n])=>`<button class="${state.page===id?"active":""}" data-page="${id}"><span>${ico}</span>${n}</button>`).join("");$("#badge").textContent=unread();$("#badge").classList.toggle("hidden",!unread());$("#sideBiz").textContent=state.business.name;$("#sideCity").textContent=state.business.city;$("#sound").style.color=state.sound?"var(--olive)":"var(--muted)"}
function head(t,d,a=""){return`<div class="head"><div><div class="eyebrow">CENTRA BUSINESS MANAGEMENT</div><h1>${t}</h1><p class="lead">${d}</p></div>${a}</div>`}function stat(l,v,n,i){return`<div class="stat"><div class="statlabel">${l}<span>${i||"◦"}</span></div><div class="statvalue">${v}</div><div class="muted">${n}</div></div>`}
function appts(rows){return rows.length?`<div class="apptlist">${rows.map(a=>`<div class="appt"><div class="time">${esc(t12(a.time))}<small>${esc(fmtDate(a.date))} · ${esc(a.deposit)}</small></div><div><strong>${esc(a.customer)}</strong><small>${esc(a.service)} · ${esc(a.staff)}<br>${esc(a.phone)} · ${esc(a.code)}</small></div>${badge(a.status)}<div class="filters" style="grid-column:2/-1">${["Requested","Awaiting payment"].includes(a.status)?`<button class="btn primary small" data-act="status" data-id="${a.id}" data-value="confirmed">Confirm</button>`:""}${["Confirmed","Requested"].includes(a.status)?`<button class="btn secondary small" data-act="reschedule" data-id="${a.id}">Reschedule</button><button class="btn secondary small" data-act="status" data-id="${a.id}" data-value="completed">Complete</button><button class="btn secondary small" data-act="status" data-id="${a.id}" data-value="no_show">No-show</button>`:""}${["Confirmed","Requested","Awaiting payment"].includes(a.status)?`<button class="btn danger small" data-act="status" data-id="${a.id}" data-value="cancelled">Cancel</button>`:""}</div></div>`).join("")}</div>`:`<div class="muted">No appointments match this filter.</div>`}
function dashboard(){let todays=state.appointments.filter(a=>a.date===state.today),active=todays.filter(a=>!["Cancelled","Rejected","Expired","Refunded","Deposit forfeited"].includes(a.status)),ss=state.services.filter(suspended).length,st=state.staff.filter(suspended).length;
let upcoming=state.appointments.filter(a=>a.date>state.today&&["Confirmed","Requested"].includes(a.status)).length;let hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
return`${head(`${greet}${state.owner.name?", "+esc(state.owner.name.split(" ")[0]):""}`,`${esc(state.business.name)} · ${esc(state.business.city)}. Here’s what’s happening today.`,`<button class="btn primary" data-act="manual">＋ New booking</button>`)}${state.topSetup==="pending"?`<div class="alert"><span>◷</span><div style="flex:1"><b>WhatsApp setup in progress</b><br>We'll call you to connect your WhatsApp number.</div></div>`:""}<div class="grid stats">${stat("Today's bookings",active.length,"Appointments on schedule","▦")}${stat("Cancellations",todays.filter(a=>["Cancelled","Refunded","Deposit forfeited"].includes(a.status)).length,"Today so far","⊗")}${stat("Upcoming",upcoming,"Confirmed after today","◷")}${stat("Awaiting action",state.appointments.filter(a=>["Requested","Awaiting payment"].includes(a.status)).length,"Requests to review","◌")}</div><div class="panel"><div class="panelhead"><div><h2>Booking page</h2><p>Share your public booking page with customers.</p></div><span class="status confirmed">${state.planActive?"Live":"Plan expired"}</span></div><div class="linkbox"><span>↗</span><span class="linkurl" id="url">${esc(state.bookingUrl)}</span><button class="btn secondary small" data-act="copy">Copy</button><button class="btn secondary small" data-act="share">Share</button></div></div>${ss||st?`<div class="alert"><span>⚠</span><div style="flex:1"><b>Suspensions need your attention</b><br>${ss} service(s) and ${st} staff member(s) currently suspended.</div><button class="btn secondary small" data-page="services">Review</button></div>`:""}${state.festivalWarnings.length?`<div class="alert"><span>⚠</span><div style="flex:1"><b>Festival dates missing</b><br>No date is set yet for ${esc(state.festivalWarnings.join(", "))}, so customers can book on that day.</div></div>`:""}<div class="grid cols" style="margin-top:16px"><section class="panel"><div class="panelhead"><div><h2>Today's appointments</h2><p>In time order</p></div><button class="btn secondary small" data-page="appointments">View all →</button></div>${appts([...todays].sort((a,b)=>a.time.localeCompare(b.time)).slice(0,6))}</section><section class="panel"><div class="panelhead"><div><h2>Recent notifications</h2><p>Updates without refreshing</p></div><button class="btn secondary small" data-page="notifications">See all</button></div>${state.notifications.slice(0,4).map(n=>`<div class="itemrow"><div class="itemicon">${n.type==="Booking"?"▦":n.type==="Cancellation"?"⊗":"⚠"}</div><div class="itemmain"><strong>${esc(n.title)}</strong><small>${esc(n.body)} · ${esc(n.when)}</small></div></div>`).join("")||'<p class="muted">No notifications yet.</p>'}</section></div>`}
function appointments(){let q=state.query.toLowerCase();let rows=state.appointments.filter(a=>(state.filter==="All statuses"||a.status===state.filter)&&(!q||[a.customer,a.phone,a.service,a.staff,a.code].some(x=>String(x||"").toLowerCase().includes(q))));
rows=[...rows].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
let m=state.calMonth||state.today.slice(0,7),[yy,mm]=m.split("-").map(Number),first=new Date(yy,mm-1,1),days=new Date(yy,mm,0).getDate(),pad=first.getDay();
let counts={};state.appointments.filter(a=>!["Cancelled","Expired","Refunded","Deposit forfeited","Rejected"].includes(a.status)).forEach(a=>counts[a.date]=(counts[a.date]||0)+1);
let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div style="font-size:10px;font-weight:700;color:var(--muted)">${d}</div>`).join("")+Array.from({length:pad},()=>"<div></div>").join("")+Array.from({length:days},(_,i)=>{let iso=`${m}-${String(i+1).padStart(2,"0")}`;return`<div style="border:1px solid var(--line);border-radius:8px;min-height:48px;padding:6px;background:${iso===state.today?"#f0f0df":"#fffaf3"};font-size:10px"><b>${i+1}</b>${counts[iso]?`<div style="margin-top:4px;color:var(--olive);font-weight:700">${counts[iso]} booking${counts[iso]>1?"s":""}</div>`:""}</div>`}).join("");
return`${head("Appointments","Manage bookings, walk-ins, phone reservations and appointment status.",`<button class="btn primary" data-act="manual">＋ Manual booking</button>`)}<div class="panel"><div class="toolbar"><div class="tabs"><button class="${state.view==="list"?"active":""}" data-act="view" data-value="list">List</button><button class="${state.view==="calendar"?"active":""}" data-act="view" data-value="calendar">Calendar</button></div><div class="filters"><input placeholder="Search customer, phone, service or code" data-search value="${esc(state.query)}"><select data-filter>${["All statuses",...statuses].map(s=>`<option ${state.filter===s?"selected":""}>${s}</option>`).join("")}</select></div></div>${state.view==="list"?appts(rows):`<div class="toolbar"><button class="btn secondary small" data-act="calMonth" data-value="-1">‹</button><h2>${first.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h2><button class="btn secondary small" data-act="calMonth" data-value="1">›</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px">${cells}</div>`}<p class="muted" style="margin-top:14px">Slot rule: service interval creates candidate slots; staff hours, breaks, leave and existing bookings filter availability.</p></div>`}

function services(){return`${head("Services","Manage service catalogue, prices, durations, slot intervals and suspensions.",`<button class="btn primary" data-act="addService">＋ Add service</button>`)}<div class="panel"><div class="toolbar"><div class="tabs"><button class="active" data-act="sf" data-value="all">All (${state.services.length})</button><button data-act="sf" data-value="shown">Shown</button><button data-act="sf" data-value="hidden">Hidden</button><button data-act="sf" data-value="suspended">Suspended</button></div><label class="filters"><input type="checkbox" data-input="pricing" ${state.business.showPricing?"checked":""}> Show prices publicly</label></div><div id="serviceRows">${serviceRows("all")}</div></div>`}
function serviceRows(f){let xs=state.services.filter(s=>f==="shown"?s.shown:f==="hidden"?!s.shown:f==="suspended"?suspended(s):true);return xs.map(s=>`<div class="itemrow"><div class="itemicon">✧</div><div class="itemmain"><strong>${esc(s.name)} ${suspended(s)?badge("Cancelled").replace("Cancelled","Suspended"):""}</strong><small>${s.duration} min duration · ${s.interval} min slot interval · ${s.shown?"Shown":"Hidden"}${s.suspend?" · Suspended "+(s.suspend==="forever"?"until turned back on":"until "+esc(fmtDate(s.suspend))):""}</small></div><div class="itemend">${money(s.price)}<small>per service</small></div><button class="switch ${s.shown?"on":""}" title="Toggle visibility" data-act="toggleService" data-id="${s.id}"></button><button class="btn secondary small" data-act="editService" data-id="${s.id}">Edit</button><button class="btn secondary small" data-act="suspendService" data-id="${s.id}">${suspended(s)?"Resume":"Suspend"}</button></div>`).join("")||`<div class="muted">Nothing in this view.</div>`}
function staff(){return`${head("Staff","Team availability, schedules, breaks, leave and temporary suspensions. Staff have no separate logins.",`<button class="btn primary" data-act="addStaff">＋ Add staff</button>`)}<div class="panel"><div class="toolbar"><div class="tabs"><button class="active" data-act="tf" data-value="all">All</button><button data-act="tf" data-value="active">Active</button><button data-act="tf" data-value="suspended">Suspended</button></div><span class="muted">Managed by the owner</span></div>${state.staff.map(s=>`<div class="itemrow"><div class="itemicon">♙</div><div class="itemmain"><strong>${esc(s.name)} · ${esc(s.role)} ${suspended(s)?badge("Cancelled").replace("Cancelled","Suspended"):badge("Confirmed").replace("Confirmed","Active")}</strong><small>${s.days.join(", ")} · ${s.start}–${s.end}<br>${s.bs?`Break ${s.bs}–${s.be}`:"No break"}${(s.leave||[]).length?` · ${s.leave.length} leave day(s) coming up`:""}${s.suspend?" · Suspended "+(s.suspend==="forever"?"until turned back on":"until "+esc(fmtDate(s.suspend))):""}</small></div><button class="btn secondary small" data-act="editStaff" data-id="${s.id}">Edit</button><button class="btn secondary small" data-act="leave" data-id="${s.id}">Leave</button><button class="btn secondary small" data-act="suspendStaff" data-id="${s.id}">${suspended(s)?"Resume":"Suspend"}</button></div>`).join("")}</div>`}
function profile(){let b=state.business;return`${head("Business profile","Edit the public business details customers see on your booking page.")}<div class="panel"><div style="display:flex;align-items:center;gap:15px;margin-bottom:18px"><div id="logoPreview" class="itemicon" style="width:65px;height:65px">${b.logo?`<img class="logoimg" src="${b.logo}">`:"🚘"}</div><div><b>${esc(b.name)}</b><p class="muted">Upload a PNG logo</p><input type="file" accept="image/png" id="logoFile"></div></div><form id="profileForm"><div class="formgrid"><div class="field"><label>Business name</label><input name="name" value="${esc(b.name)}" required></div><div class="field"><label>City</label><input name="city" value="${esc(b.city)}" required></div><div class="field full"><label>Address</label><input name="address" value="${esc(b.address)}" required></div><div class="field"><label>Phone</label><input name="phone" value="${esc(b.phone)}"></div><div class="field"><label>Booking slug</label><input name="slug" pattern="[a-z0-9-]+" value="${esc(b.slug)}" required><small class="muted">${esc(location.host)}/${esc(b.slug)}</small></div><div class="field"><label>Opening time</label><input name="open" type="time" value="${b.open}"></div><div class="field"><label>Closing time</label><input name="close" type="time" value="${b.close}"></div><div class="field full"><label>Working days</label><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<label class="day ${b.days.includes(d)?"on":""}"><input type="checkbox" name="days" value="${d}" ${b.days.includes(d)?"checked":""} style="min-height:auto">${d}</label>`).join("")}</div></div></div><button class="btn primary">Save changes</button></form></div>`}
function customers(){let xs=state.customers.filter(c=>(c.name+" "+c.phone+" "+c.email).toLowerCase().includes(state.query.toLowerCase()));
return`${head("Customers","Customer directory, contact details, booking history and notes.")}<div class="panel"><div class="toolbar"><input placeholder="Search by name, phone or email" data-search value="${esc(state.query)}"><span class="status">${state.customers.length} customers</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Customer</th><th>Phone</th><th>Bookings</th><th>Last booking</th><th>Notes</th><th></th></tr></thead><tbody>${xs.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small class="muted">${esc(c.email.endsWith("@no-email.centra")?"":c.email)}</small></td><td>${esc(c.phone)}</td><td>${c.bookings}</td><td>${esc(c.last)}</td><td>${esc(c.notes||"—")}</td><td><button class="btn secondary small" data-act="notes" data-id="${c.id}">Edit notes</button></td></tr>`).join("")}</tbody></table></div>${xs.length?"":'<p class="muted">Customers appear here after their first booking.</p>'}<button class="btn secondary" style="margin-top:12px" data-act="export">Export customer CSV</button></div>`}
function payments(){const p=state.payments;return`${head("Payments & deposits","Configure deposits and review payment history, refunds and business payouts.")}<div class="grid stats">${stat("Deposits collected",money(p.total),"All time","₹")}${stat("Deposits held",money(p.held),"For upcoming bookings","◷")}${stat("Refunds",money(p.refunds),"Returned to customers","↶")}${stat("Payouts",money(p.payouts),"Due to your business","↗")}</div><div class="grid cols"><section class="panel"><h2>Deposit settings</h2><p class="muted">Charge a deposit to hold a booking slot.</p><p><label><input type="checkbox" data-input="deposits" ${state.deposits?"checked":""}> Enable deposits</label></p><div class="field"><label>Deposit percentage</label><select data-input="percent">${[5,10,15,20,25,30,50].map(n=>`<option ${n===state.depositPercent?"selected":""}>${n}</option>`).join("")}</select></div><div class="field"><label>Full refund cancellation window</label><select data-input="refund">${[6,12,24,48,72].map(n=>`<option value="${n}" ${String(n)===state.refundWindow?"selected":""}>Up to ${n} hours before slot</option>`).join("")}</select></div><button class="btn primary" data-act="saveDeposits">Save settings</button><p class="notice">Deposits are collected by CENTRA through Razorpay and paid out to your business. Automatic split payouts (Razorpay Route) switch on once Razorpay approves the account.</p></section><section class="panel"><h2>Recent payment activity</h2><div class="tablewrap" style="margin-top:14px"><table class="table"><thead><tr><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${p.recent.map(r=>`<tr><td>${esc(r.customer)}</td><td>${esc(r.when)}</td><td>${money(r.amount)}</td><td>${badge(r.status==="Paid"?"Confirmed":r.status==="Pending"?"Awaiting payment":r.status).replace(">Confirmed<",">Paid<")}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">No payments yet.</td></tr>'}</tbody></table></div></section></div>`}
function reports(){const r=state.reports;return`${head("Reports","Understand demand, service performance and customer retention. Last 30 days.")}<div class="grid stats">${stat("Bookings",r.bookings,"Last 30 days","▦")}${stat("Cancellations",r.cancellations,r.cancellationsNote||"","⊗")}${stat("No-shows",r.noShows,r.noShowsNote||"","♙")}${stat("Completed",r.completed,r.completedNote||"","✓")}</div><div class="grid cols"><section class="panel"><h2>Busiest days</h2><div class="chart">${r.busiest.map(([d,h,n])=>`<div class="barwrap" title="${n} bookings"><div class="bar" style="height:${Math.max(h,2)}%"></div><span>${d}</span></div>`).join("")}</div></section><section class="panel"><h2>Top services</h2>${r.topServices.map(([n,v,w])=>`<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px">${esc(n)}<b>${v}</b></div><div style="height:7px;background:#e9e2d3;border-radius:8px"><div style="height:100%;width:${w}%;background:var(--olive);border-radius:8px"></div></div></div>`).join("")||'<p class="muted">No bookings in this period yet.</p>'}</section></div><div class="grid stats" style="margin-top:15px">${stat("Repeat customers",r.repeatCustomers,"Booked 2+ times in 30 days","♧")}${stat("Customers",r.customersInPeriod,"Booked in 30 days","◦")}</div>`}
function subscription(){return`${head("Subscription","Manage your plan, renewal, billing history and pack preferences.")}<div class="grid cols"><section class="panel"><h2>Current plan</h2><div class="plan selected" style="margin-top:14px"><span class="status ${state.planActive?"confirmed":"cancelled"}">${state.planActive?"ACTIVE":"EXPIRED"}</span><div class="price">${state.plan} Plan</div><p class="muted">${state.plan==="Top"?"Booking, management and WhatsApp receptionist.":"Manage bookings, services, staff and customers."}</p><div class="divider"></div><p class="muted">Active until: <b>${esc(state.renewal)}</b></p><p class="muted">Billing: ${esc(state.billing)}</p><button class="btn primary" data-act="renew" data-value="${state.billing==="Monthly"?"monthly":"pack"}">Renew plan</button> <button class="btn secondary" data-act="switchPack">Switch pack</button></div></section><section class="panel"><h2>Upgrade to Top</h2><p class="muted">WhatsApp receptionist, knowledge approvals and priority support.</p><div class="plan"><div class="price">Top</div><ul class="muted"><li>WhatsApp AI receptionist</li><li>Knowledge management</li><li>Priority support</li></ul><p class="notice">Top is available for Meta-verified businesses. Upgrades from the dashboard are coming soon; contact ${esc(state.supportEmail||"support")} to upgrade now.</p></div></section></div><section class="panel" style="margin-top:15px"><h2>Billing history</h2><div class="tablewrap" style="margin-top:13px"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th></tr></thead><tbody>${state.billingHistory.map(b=>`<tr><td>${esc(b.invoice)}</td><td>${esc(b.date)}</td><td>${esc(b.plan)}<br><small class="muted">${esc(b.period)}</small></td><td>${money(b.amount)}</td><td>${badge("Confirmed").replace(">Confirmed<",">Paid<")}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">No invoices yet.</td></tr>'}</tbody></table></div></section>`}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function closureText(c){const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");return c.type==="range"?`Closed from ${esc(fmtDate(c.start))} through ${esc(fmtDate(c.end))} (inclusive)`:c.type==="weekly"?`Every ${esc(c.weekday)}`:c.type==="monthly"?`Every ${ord(Number(c.day))} of the month`:c.type==="yearly"?`Every year on ${Number(c.day)} ${MONTHS[c.month-1]}`:`Every year on ${esc(c.festivalLabel)} (date changes each year)`}
const CTYPE={range:["▣","Date range"],weekly:["↻","Weekly"],monthly:["◷","Monthly"],yearly:["✦","Yearly"],festival:["✺","Festival"]};
function closures(){return`${head("Closed for business","Set one-off closure periods, recurring weekly days off, a date each month, a date each year, or a festival.",`<button class="btn primary" data-act="addClosure">＋ Add closure</button>`)}
<div class="grid stats">${stat("Closure rules",state.closures.length,"One-off and recurring","◷")}${stat("Recurring rules",state.closures.filter(c=>c.type!=="range").length,"Weekly / monthly / yearly","↻")}${stat("One-off periods",state.closures.filter(c=>c.type==="range").length,"Date ranges","▣")}${stat("Booking protection","ON","Closed dates block availability","✓")}</div>
<div class="panel"><div class="panelhead"><div><h2>Closure schedule</h2><p>Customers can't book during these dates or recurring closures.</p></div><span class="status confirmed">Booking protection enabled</span></div>
${state.closures.map(c=>`<div class="itemrow"><div class="itemicon">${CTYPE[c.type][0]}</div><div class="itemmain"><strong>${esc(c.label)}</strong><small>${closureText(c)}${c.note?" · "+esc(c.note):""}</small></div><span class="status">${CTYPE[c.type][1]}</span><button class="btn secondary small" data-act="editClosure" data-id="${c.id}">Edit</button><button class="btn danger small" data-act="deleteClosure" data-id="${c.id}">Remove</button></div>`).join("")}
${state.closures.length?"":'<p class="muted">No closure rules configured. Your business is available according to its regular hours.</p>'}
<div class="notice"><b>How dates work:</b> date ranges include both the start and end date. Weekly rules repeat on the selected weekday, monthly rules on the selected day number, yearly rules on the same date every year. Festival dates (like Diwali) move each year and are kept up to date by CENTRA. If a business closes on a day that already has bookings, it contacts those customers directly.</div></div>`}
function closureForm(c={}){const t=c.type||"range";const opt=(v,l)=>`<option value="${v}" ${t===v?"selected":""}>${l}</option>`;
modal(c.id?"Edit closure":"Add closure",`<form id="closureForm" data-id="${c.id||""}"><div class="field"><label>Closure type</label><select name="type" id="closureType">${opt("range","Specific date range")}${opt("weekly","Every week on a day")}${opt("monthly","Every month on a date")}${opt("yearly","Every year on a date")}${opt("festival","Every year on a festival")}</select></div><div class="field"><label>Label</label><input name="label" required maxlength="80" value="${esc(c.label||"")}" placeholder="e.g. Annual holiday, weekly day off"></div><div id="rangeFields" class="${t==="range"?"":"hidden"}"><div class="formgrid"><div class="field"><label>Closed from (inclusive)</label><input type="date" name="start" value="${esc(c.start||state.today)}"></div><div class="field"><label>Closed through (inclusive)</label><input type="date" name="end" value="${esc(c.end||state.today)}"></div></div></div><div id="weeklyFields" class="${t==="weekly"?"":"hidden"}"><div class="field"><label>Repeat every</label><select name="weekday">${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(d=>`<option ${c.weekday===d?"selected":""}>${d}</option>`).join("")}</select></div></div><div id="monthlyFields" class="${t==="monthly"?"":"hidden"}"><div class="field"><label>Repeat on day of month</label><select name="day">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option ${Number(c.day||15)===d?"selected":""}>${d}</option>`).join("")}</select></div></div><div id="yearlyFields" class="${t==="yearly"?"":"hidden"}"><div class="formgrid"><div class="field"><label>Day</label><select name="yday">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option ${Number(c.day||1)===d?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label>Month</label><select name="month">${MONTHS.map((n,i)=>`<option value="${i+1}" ${Number(c.month||1)===i+1?"selected":""}>${n}</option>`).join("")}</select></div></div></div><div id="festivalFields" class="${t==="festival"?"":"hidden"}"><div class="field"><label>Festival</label><select name="festival">${state.festivals.map(f=>`<option value="${esc(f.key)}" ${c.festival===f.key?"selected":""}>${esc(f.label)}</option>`).join("")}</select><small class="muted">The date is updated for you every year.</small></div></div><div class="field"><label>Note (optional)</label><input name="note" maxlength="255" value="${esc(c.note||"")}"></div><button class="btn primary">Save closure</button></form>`)}
function notifications(){return`${head("Notifications","Bookings, cancellations, suspensions and account updates.",`<button class="btn secondary" data-act="markAll">Mark all read</button>`)}<div class="panel"><div class="toolbar"><div class="tabs">${["All","Booking","Cancellation","System"].map(t=>`<button class="${(state.nfilter||"All")===t?"active":""}" data-act="nf" data-value="${t}">${t}</button>`).join("")}</div><label><input type="checkbox" data-input="sound" ${state.sound?"checked":""}> Sound while dashboard is open</label></div>${state.notifications.filter(n=>(state.nfilter||"All")==="All"||n.type===state.nfilter).map(n=>`<div class="itemrow"><div class="itemicon">${n.type==="Booking"?"▦":n.type==="Cancellation"?"⊗":"⚠"}</div><div class="itemmain"><strong>${esc(n.title)} ${n.unread?'<span class="status requested">NEW</span>':""}</strong><small>${esc(n.body)} · ${esc(n.when)}</small></div>${n.unread?`<button class="btn secondary small" data-act="read" data-id="${n.id}">Mark read</button>`:""}</div>`).join("")||'<p class="muted">No notifications yet.</p>'}<p class="notice">New bookings and cancellations appear here instantly while the dashboard is open, and are also emailed to you.</p></div>`}

function render(){nav();$("#crumb").textContent="Business management / "+(navItems.find(x=>x[0]===state.page)?.[2]||"Dashboard");$("#view").innerHTML=({home:dashboard,appointments,services,staff,customers,payments,reports,closures,profile,subscription,notifications})[state.page]()}
function modal(title,body){$("#modal").innerHTML=`<div class="modalbg"><div class="modal"><div class="modalhead"><h2>${title}</h2><button class="close" data-act="close">×</button></div>${body}</div></div>`}function close(){ $("#modal").innerHTML=""}function byid(arr,id){return arr.find(x=>x.id===+id)}
function suspend(type,o){modal("Suspend "+type,`<p class="muted">Temporarily remove <b>${esc(o.name)}</b> from new booking availability. Existing bookings stay as they are.</p><div class="field"><label>Suspension period</label><select id="period"><option value="1">1 day (today)</option><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="forever">Until I turn it back on</option></select></div><button class="btn primary" data-act="confirmSuspend" data-type="${type}" data-id="${o.id}">Confirm suspension</button>`)}
const DAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
function dayBoxes(sel){return`<div class="field full"><label>Working days</label><div class="days">${DAYS.map(d=>`<label class="day ${sel.includes(d)?"on":""}"><input type="checkbox" name="days" value="${d}" ${sel.includes(d)?"checked":""} style="min-height:auto">${d}</label>`).join("")}</div></div>`}
function staffForm(id,s){return`<form id="${id}" data-id="${s.id||""}"><div class="field"><label>Name</label><input name="name" value="${esc(s.name||"")}" required></div><div class="field"><label>Role</label><input name="role" value="${esc(s.role||"")}"></div><div class="formgrid"><div class="field"><label>Start</label><input name="start" type="time" value="${s.start||state.business.open}"></div><div class="field"><label>End</label><input name="end" type="time" value="${s.end||state.business.close}"></div><div class="field"><label>Break start (optional)</label><input name="bs" type="time" value="${s.bs||""}"></div><div class="field"><label>Break end (optional)</label><input name="be" type="time" value="${s.be||""}"></div>${dayBoxes(s.days||state.business.days)}</div><button class="btn primary">${s.id?"Save staff":"Add staff"}</button></form>`}
function serviceForm(id,s){return`<form id="${id}" data-id="${s.id||""}"><div class="field"><label>Service name</label><input name="name" value="${esc(s.name||"")}" required></div><div class="formgrid"><div class="field"><label>Price ₹</label><input type="number" name="price" value="${s.price??0}" min="0" step="1"></div><div class="field"><label>Duration minutes</label><input type="number" name="duration" value="${s.duration||30}" min="5" max="720"></div><div class="field full"><label>Slot interval (minutes)</label><select name="interval">${[15,30,45,60,90,120].map(n=>`<option ${(s.interval||30)===n?"selected":""}>${n}</option>`).join("")}</select></div></div><button class="btn primary">${s.id?"Save service":"Add service"}</button></form>`}
async function payOrder(order){try{await Centra.pay(order,{name:state.owner.name,email:state.owner.email});toast("Payment confirmed");await reload()}catch(e){toast(e.message)}}
function act(el){let a=el.dataset.act,v=el.dataset.value,id=el.dataset.id;
switch(a){
case"manual":modal("Create manual booking",`<form id="manualForm"><div class="formgrid"><div class="field"><label>Customer name</label><input name="customer" required></div><div class="field"><label>Phone</label><input name="phone" required></div><div class="field full"><label>Email (optional)</label><input name="email" type="email"></div><div class="field"><label>Service</label><select name="service">${state.services.filter(s=>!suspended(s)).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Staff</label><select name="staff"><option value="any">Any available</option>${state.staff.filter(s=>!suspended(s)).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div><div class="field"><label>Date</label><input type="date" name="date" value="${state.today}" required></div><div class="field"><label>Time</label><input type="time" name="time" value="10:00" required></div><div class="field full"><label>Status</label><select name="status"><option value="confirmed">Confirmed</option><option value="requested">Requested</option></select></div></div><button class="btn primary">Create booking</button></form>`);break;
case"copy":navigator.clipboard?.writeText(state.bookingUrl).then(()=>toast("Booking link copied")).catch(()=>toast(state.bookingUrl));break;
case"share":navigator.share?navigator.share({title:state.business.name,url:state.bookingUrl}).catch(()=>{}):toast(state.bookingUrl);break;
case"status":{const label={confirmed:"Booking confirmed",completed:"Marked completed",no_show:"Marked no-show",cancelled:"Booking cancelled"}[v];
 if(v==="cancelled"&&!confirm("Cancel this booking? Any deposit paid will be refunded to the customer."))break;
 call(Centra.post(`/api/dashboard/appointments/${id}/status`,{status:v}),label);break}
case"reschedule":{let x=byid(state.appointments,id);modal("Reschedule appointment",`<div class="field"><label>New date</label><input id="newdate" type="date" value="${x.date}"></div><div class="field"><label>New time</label><input id="newtime" type="time" value="${x.time}"></div><p class="muted">Staff hours, breaks, leave and other bookings are checked when you save.</p><button class="btn primary" data-act="saveReschedule" data-id="${id}">Save time</button>`);break}
case"saveReschedule":call(Centra.post(`/api/dashboard/appointments/${id}/reschedule`,{date:$("#newdate").value,time:$("#newtime").value}),"Appointment rescheduled").then(close,()=>{});break;
case"view":state.view=v;render();break;
case"calMonth":{let m=state.calMonth||state.today.slice(0,7),[y,mo]=m.split("-").map(Number),d=new Date(y,mo-1+Number(v),1);state.calMonth=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;render();break}
case"addClosure":closureForm();break;
case"editClosure":closureForm(state.closures.find(c=>c.id===+id));break;
case"deleteClosure":if(confirm("Remove this closure rule?"))call(Centra.del(`/api/dashboard/closures/${id}`),"Closure rule removed");break;
case"addService":modal("Add service",serviceForm("newService",{}));break;
case"toggleService":call(Centra.post(`/api/dashboard/services/${id}/toggle`));break;
case"editService":modal("Edit service",serviceForm("editService",byid(state.services,id)));break;
case"suspendService":{let s=byid(state.services,id);if(suspended(s))call(Centra.post(`/api/dashboard/services/${id}/resume`),"Service resumed");else suspend("service",s);break}
case"sf":$("#serviceRows").innerHTML=serviceRows(v);document.querySelectorAll('[data-act="sf"]').forEach(b=>b.classList.toggle("active",b.dataset.value===v));break;
case"addStaff":modal("Add staff member",staffForm("newStaff",{}));break;
case"editStaff":modal("Edit staff member",staffForm("editStaff",byid(state.staff,id)));break;
case"suspendStaff":{let s=byid(state.staff,id);if(suspended(s))call(Centra.post(`/api/dashboard/staff/${id}/resume`),"Staff member resumed");else suspend("staff",s);break}
case"tf":document.querySelectorAll(".itemrow").forEach((r,i)=>{let s=state.staff[i];if(s)r.classList.toggle("hidden",v==="active"?suspended(s):v==="suspended"?!suspended(s):false)});document.querySelectorAll('[data-act="tf"]').forEach(b=>b.classList.toggle("active",b.dataset.value===v));break;
case"leave":{let s=byid(state.staff,id);modal("Staff leave / holiday",`${(s.leave||[]).length?`<p class="muted">Upcoming leave</p>${s.leave.map(l=>`<div class="itemrow"><div class="itemmain"><strong>${esc(fmtDate(l.date))}</strong><small>${esc(l.reason||"")}</small></div><button class="btn danger small" data-act="removeLeave" data-id="${id}" data-value="${l.date}">Remove</button></div>`).join("")}`:""}<div class="field"><label>Leave date</label><input id="leavedate" type="date" min="${state.today}"></div><div class="field"><label>Reason</label><input id="leavereason" placeholder="Annual leave, holiday…"></div><button class="btn primary" data-act="saveLeave" data-id="${id}">Save leave</button>`);break}
case"saveLeave":{let d=$("#leavedate").value;if(!d){toast("Choose a date");return}call(Centra.post(`/api/dashboard/staff/${id}/leave`,{date:d,reason:$("#leavereason").value}),"Leave saved").then(close,()=>{});break}
case"removeLeave":call(Centra.del(`/api/dashboard/staff/${id}/leave/${v}`),"Leave removed").then(close,()=>{});break;
case"notes":{let c=byid(state.customers,id);modal("Customer notes",`<p><b>${esc(c.name)}</b> · ${esc(c.phone)}</p><div class="field"><label>Notes</label><textarea id="notesText" rows="4">${esc(c.notes)}</textarea></div><button class="btn primary" data-act="saveNotes" data-id="${c.id}">Save notes</button>`);break}
case"saveNotes":call(Centra.put(`/api/dashboard/customers/${id}/notes`,{notes:$("#notesText").value}),"Notes saved").then(close,()=>{});break;
case"saveDeposits":call(Centra.put("/api/dashboard/settings",{deposits:document.querySelector('[data-input="deposits"]').checked,depositPercent:+document.querySelector('[data-input="percent"]').value,refundWindow:+document.querySelector('[data-input="refund"]').value}),"Deposit settings saved");break;
case"export":{let csv="Customer,Email,Phone,Bookings,Last booking,Notes\n"+state.customers.map(c=>[c.name,c.email,c.phone,c.bookings,c.last,c.notes].map(x=>'"'+String(x??"").replaceAll('"','""')+'"').join(",")).join("\n");let blob=new Blob([csv],{type:"text/csv"}),url=URL.createObjectURL(blob),l=document.createElement("a");l.href=url;l.download="centra-customers.csv";l.click();URL.revokeObjectURL(url);break}
case"renew":Centra.post("/api/dashboard/subscription/renew",{billing:v}).then(r=>payOrder(r.order),e=>toast(e.message));break;
case"switchPack":modal("Renew with a different pack",`<div class="field"><label>Billing</label><select id="pack"><option value="monthly">Monthly</option><option value="pack">6-month pack</option></select></div><p class="muted">You'll pay for the chosen period now. It starts when your current period ends.</p><button class="btn primary" data-act="savePack">Continue to payment</button>`);break;
case"savePack":{let b=$("#pack").value;close();Centra.post("/api/dashboard/subscription/renew",{billing:b}).then(r=>payOrder(r.order),e=>toast(e.message));break}
case"nf":state.nfilter=v;render();break;
case"markAll":call(Centra.post("/api/dashboard/notifications/read",{all:true}),"All notifications marked read");break;
case"read":call(Centra.post("/api/dashboard/notifications/read",{id:+id}));break;
case"signout":Centra.signOut();break;
case"close":close();break;
case"confirmSuspend":{let type=el.dataset.type,p=$("#period").value;call(Centra.post(`/api/dashboard/${type==="service"?"services":"staff"}/${id}/suspend`,{period:p}),"Suspension saved").then(close,()=>{});break}}
}
document.addEventListener("click",e=>{let p=e.target.closest("[data-page]");if(p){state.page=p.dataset.page;state.query="";render();window.scrollTo({top:0});return}let el=e.target.closest("[data-act]");if(el){e.preventDefault();act(el)}});
document.addEventListener("input",e=>{if(e.target.matches("[data-search]")){state.query=e.target.value;let p=e.target.selectionStart;render();let q=$("[data-search]");if(q){q.focus();q.setSelectionRange(p,p)}}});
document.addEventListener("change",async e=>{let el=e.target;
 if(el.matches("[data-filter]")){state.filter=el.value;render()}
 if(el.dataset.input==="pricing")call(Centra.put("/api/dashboard/settings",{showPricing:el.checked}),"Price display updated");
 if(el.dataset.input==="sound")call(Centra.put("/api/dashboard/settings",{sound:el.checked}));
 if(el.id==="closureType"){["range","weekly","monthly","yearly","festival"].forEach(t=>$("#"+t+"Fields")?.classList.toggle("hidden",t!==el.value))}
 if(el.matches('.day input[type="checkbox"]'))el.closest(".day").classList.toggle("on",el.checked);
 if(el.id==="logoFile"&&el.files[0]){const f=el.files[0];if(f.type!=="image/png"){toast("PNG files only");return}if(f.size>1000000){toast("The logo must be smaller than 1 MB");return}
  try{await Centra.upload("/api/dashboard/logo",f);toast("Logo updated");await reload()}catch(err){toast(err.message)}}});
document.addEventListener("submit",e=>{e.preventDefault();let f=e.target,d=new FormData(f);
 if(f.id==="closureForm"){let type=d.get("type"),body={type,label:(d.get("label")||"").trim(),note:(d.get("note")||"").trim()};
  if(type==="range"){body.start=d.get("start");body.end=d.get("end");if(!body.start||!body.end||body.end<body.start){toast("Choose a valid date range");return}}
  if(type==="weekly")body.weekday=d.get("weekday");if(type==="monthly")body.day=+d.get("day");if(type==="yearly"){body.day=+d.get("yday");body.month=+d.get("month")}if(type==="festival")body.festival=d.get("festival");
  call(f.dataset.id?Centra.put(`/api/dashboard/closures/${f.dataset.id}`,body):Centra.post("/api/dashboard/closures",body),"Closure schedule saved").then(()=>{close();state.page="closures";render()},()=>{})}
 if(f.id==="manualForm")call(Centra.post("/api/dashboard/appointments",{customer:d.get("customer"),phone:d.get("phone"),email:d.get("email")||"",service_ids:[+d.get("service")],staff:d.get("staff"),date:d.get("date"),time:d.get("time"),status:d.get("status")}),"Manual booking created").then(()=>{close();state.page="appointments";render()},()=>{});
 const svc=()=>({name:d.get("name"),price:+d.get("price")||0,duration:+d.get("duration"),interval:+d.get("interval")});
 if(f.id==="newService")call(Centra.post("/api/dashboard/services",svc()),"Service added").then(close,()=>{});
 if(f.id==="editService")call(Centra.put(`/api/dashboard/services/${f.dataset.id}`,svc()),"Service saved").then(close,()=>{});
 const stf=()=>({name:d.get("name"),role:d.get("role")||"",start:d.get("start"),end:d.get("end"),bs:d.get("bs")||"",be:d.get("be")||"",days:d.getAll("days")});
 if(f.id==="newStaff")call(Centra.post("/api/dashboard/staff",stf()),"Staff added").then(close,()=>{});
 if(f.id==="editStaff")call(Centra.put(`/api/dashboard/staff/${f.dataset.id}`,stf()),"Staff saved").then(close,()=>{});
 if(f.id==="profileForm")call(Centra.put("/api/dashboard/profile",{name:d.get("name"),city:d.get("city"),address:d.get("address")||"",phone:d.get("phone")||"",slug:d.get("slug"),open:d.get("open"),close:d.get("close"),days:d.getAll("days")}),"Business profile saved");});
$("#bell").addEventListener("click",()=>{state.page="notifications";render()});
$("#sound").addEventListener("click",()=>call(Centra.put("/api/dashboard/settings",{sound:!state.sound}),state.sound?"Sound muted":"Sound enabled"));
function beep(){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(C){let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.03;o.start();o.stop(c.currentTime+.12)}}catch{}}
let es=null;
function listen(){if(es)es.close();es=new EventSource("/api/dashboard/events?after="+(state.lastNotificationId||0));
 es.addEventListener("notification",ev=>{const n=JSON.parse(ev.data);state.lastNotificationId=Math.max(state.lastNotificationId,n.id);beep();toast(n.title+(n.body?" · "+n.body:""));reload()});
 es.onerror=()=>{es.close();setTimeout(listen,10000)}}
(async function init(){try{const me=await Centra.get("/api/auth/me");state.owner=me.user;$(".ownerlabel").textContent=me.user.name+" · Owner"}catch(e){location.href="/";return}
 await reload();listen()})();

</script></body></html>
