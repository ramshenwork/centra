<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CENTRA Management</title>
<style>
:root{--bg:#f2ebdf;--paper:#fffaf1;--ink:#303123;--muted:#7b7767;--olive:#59652e;--line:#ded1bd;--soft:#e9e3d0;--red:#a94c3f;--green:#4e7043}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#fffaf1,transparent 40%),linear-gradient(145deg,#f4eee3,#e9e1d1);color:var(--ink);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #a9b27c;outline-offset:2px}.app{display:grid;grid-template-columns:225px 1fr;min-height:100vh}.side{background:#f8f2e8d9;border-right:1px solid var(--line);padding:20px 13px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;font:22px Georgia,serif;letter-spacing:.25em}.mark{width:29px;height:29px;border:2px solid var(--olive);border-right-color:transparent;border-radius:50%;transform:rotate(-25deg)}.biz{padding:11px;border:1px solid var(--line);border-radius:13px;background:var(--paper);font-size:12px}.biz small{display:block;color:var(--muted);margin-top:4px}.navlabel{font-size:9px;color:#928a78;letter-spacing:.15em;font-weight:800;padding:0 10px;margin-bottom:7px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#686655;text-align:left;padding:11px;border-radius:11px;font-size:12px}.nav button:hover{background:#efeadc}.nav button.active{background:var(--olive);color:white}.main{min-width:0}.top{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line);background:#f8f2e8aa;position:sticky;top:0;z-index:2;backdrop-filter:blur(10px)}.crumb{font-size:11px;color:var(--muted)}.topright{display:flex;align-items:center;gap:10px}.iconbtn{position:relative;border:1px solid var(--line);border-radius:50%;width:37px;height:37px;background:var(--paper)}.badge{position:absolute;right:-2px;top:-3px;background:var(--red);color:white;border-radius:2 nt-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}.status{display:inline-flex;border-radius:99px;padding:5px 8px;font-size:9px;font-weight:800;background:#ece8d7;color:#59602f;white-space:nowrap}.confirmed,.completed{background:#e4eddc;color:#41653c}.requested,.awaiting-payment{background:#fff0d7;color:#966116}.cancelled,.no-show,.rejected{background:#f6e3de;color:#9e4438}.alert{display:flex;gap:12px;align-items:center;background:#f8edcf;border:1px solid #e9dcb7;border-radius:13px;padding:13px;margin:13px 0;font-size:11px}.quick{grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px}.tile{display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink);cursor:pointer}.tile:hover{border-color:var(--olive)}.tileicon{width:37px;height:37px;flex-shrink:0;border-radius:50%;background:#e7e5d0;color:var(--olive);display:grid;place-items:center;font-size:17px}.tile strong{display:block;font:500 16px Georgia,serif}.tile small{font-size:10px;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}.tabs,.filters{display:flex;gap:6px;flex-wrap:wrap}.tabs{background:#eee7d9;padding:4px;border-radius:99px}.tabs button{border:0;background:transparent;padding:8px 12px;border-radius:99px;color:var(--muted);font-size:10px}.tabs button.active{background:var(--olive);color:white}input,select,textarea{border:1px solid var(--line);background:#fffaf3;border-radius:10px;padding:10px;color:var(--ink);font-size:11px;min-height:36px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.field{display:grid;gap:6px;margin-bottom:13px}.field label{font-size:11px;font-weight:800}.field input,.field select,.field textarea{width:100%}.full{grid-column:1/-1}.tablewrap{overflow:auto;border:1px solid #e7ddcd;border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:680px;background:#fffaf4}.table th{text-align:left;background:#f0eadc;color:#77705e;font-size:9px;text-transform:uppercase;letter-spacing:.08em;padding:12px}.table td{padding:12px;border-top:1px solid #eee5d7;font-size:11px}.table td small{display:block;color:var(--muted);margin-top:4px}.itemrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #e9dfcf}.itemrow:last-child{border:0}.itemicon{width:40px;height:40px;border-radius:12px;background:#e7e4d0;display:grid;place-items:center;font-size:19px;flex-shrink:0}.itemmain{flex:1;min-width:0}.itemmain strong{font-size:12px}.itemmain small{display:block;font-size:10px;color:var(--muted);margin-top:5px;line-height:1.5}.itemend{text-align:right;font-size:12px;font-weight:800}.itemend small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.switch{border:0;background:#c8c1b2;width:35px;height:20px;border-radius:99px;padding:3px}.switch:after{content:"";display:block;background:white;width:14px;height:14px;border-radius:50%}.switch.on{background:var(--olive)}.switch.on:after{transform:translateX(15px)}.plan{border:1px solid var(--line);background:#fffaf3;border-radius:15px;padding:17px}.plan.selected{border:2px solid var(--olive);background:#f1f0e3}.price{font:500 28px Georgia,serif;margin:12px 0}.chart{height:170px;display:flex;align-items:end;gap:13px;border-bottom:1px solid var(--line);padding:20px 8px 0}.barwrap{height:100%;display:flex;align-items:center;justify-content:end;flex-direction:column;gap:7px;flex:1}.bar{width:30px;max-width:70%;background:linear-gradient(#929969,#59652e);border-radius:7px 7px 0 0}.barwrap span{font-size:9px;color:var(--muted)}.notice{padding:12px;border-radius:12px;background:#efedda;color:#5b6037;font-size:11px;line-height:1.5;margin:12px 0}.hidden{display:none!important}.modalbg{position:fixed;inset:0;background:#26261977;z-index:10;display:grid;place-items:center;padding:16px}.modal{width:min(100%,520px);max-height:90vh;overflow:auto;background:var(--paper);border-radius:20px;padding:22px;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modalhead h2{font:500 24px Georgia,serif;margin:0}.close{border:0;border-radius:50%;width:30px;height:30px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#303322;color:white;border-radius:99px;padding:12px 17px;font-size:11px;z-index:20}.bottomnav{display:none}.days{display:flex;gap:5px;flex-wrap:wrap}.day{border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:transparent;font-size:10px}.day.on{background:var(--olive);color:white}.logoimg{width:66px;height:66px;object-fit:cover;border-radius:15px}@media(max-width:900px){.app{grid-template-columns:70px 1fr}.side{padding:16px 7px}.brand{font-size:0}.biz{font-size:0;text-align:center;padding:10px}.biz small{display:none}.navlabel,.nav button span:last-child{display:none}.nav button{text-align:center;padding:12px 3px;font-size:17px}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{display:block;padding-bottom:68px}.side{display:none}.top{height:60px;padding:0 13px}.content{padding:20px 12px 28px}.head{align-items:center}.head .lead{max-width:240px}.stats{gap:9px}.stat{padding:13px}.statvalue{font-size:27px}.panel{padding:14px}.appt{grid-template-columns:53px 1fr;gap:8px}.appt>.status{grid-column:2;justify-self:start}.quick{gap:8px}.tile{padding:11px;gap:8px}.tileicon{width:30px;height:30px}.tile strong{font-size:14px}.tile small{font-size:9px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.bottomnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:5;background:#faf4e9;border-top:1px solid var(--line);justify-content:space-around;padding:8px 3px}.bottomnav button{border:0;background:transparent;color:var(--muted);font-size:9px;display:grid;gap:3px;justify-items:center}.bottomnav button.active{color:var(--olive);font-weight:800}.bottomnav span{font-size:17px}.table{min-width:700px}.head .btn{padding:8px 10px}.ownerlabel{display:none}}

/* manual booking: multi-service picker */
.mpchips{display:flex;flex-wrap:wrap;gap:6px}.mpchips:empty{display:none}
.mpchip{display:inline-flex;align-items:center;gap:4px;background:var(--soft);border-radius:99px;padding:4px 5px 4px 11px;font-size:10px;font-weight:800}
.mpchip button{border:0;background:transparent;color:var(--ink);font-size:14px;line-height:1;padding:0 5px;cursor:pointer;border-radius:50%}
.mplist{max-height:210px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fffaf3}
.field .mprow{display:flex;align-items:center;gap:10px;padding:9px 11px;margin:0;border-bottom:1px solid var(--soft);cursor:pointer;font-weight:600;font-size:11px}
.field .mprow:last-child{border-bottom:0}.field .mprow:hover{background:var(--soft)}
.field .mprow:focus-within{outline:2px solid var(--olive);outline-offset:-2px}
.field .mprow input{width:auto;min-height:0;padding:0;accent-color:var(--olive);flex:none}
.mprow .mpname{flex:1}.mprow .muted{white-space:nowrap}
.mpempty{padding:14px;text-align:center}
.mpsum{font-size:10px;color:var(--muted)}
.mpfield.bad .mplist{border-color:var(--red);box-shadow:0 0 0 3px #a94c3f22}.mpfield.bad .mpsum{color:var(--red)}

/* change-status popup */
.stopts{display:grid;gap:8px;margin:12px 0}
.stopt{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;font-weight:700;font-size:12px;background:#fffaf3}
.stopt:hover{background:var(--soft)}.stopt:focus-within{outline:2px solid var(--olive);outline-offset:1px}
.stopt input{width:auto;min-height:0;padding:0;accent-color:var(--olive);flex:none}.stopt span{flex:1}
.stopt.off{opacity:.45;cursor:not-allowed}.stopt:has(input:checked){border-color:var(--olive);background:var(--soft)}

/* top-bar New booking, clickable cards, popups, calendar */
.newbk{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 15px;font-weight:800;font-size:12px;margin-right:6px;white-space:nowrap}
.stat.clickable{appearance:none;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer;transition:transform .15s,box-shadow .15s}
.stat.clickable:hover{transform:translateY(-2px);box-shadow:0 16px 38px #41371926}
.stat.clickable:focus-visible{outline:2px solid var(--olive);outline-offset:2px}
.statgo{font-size:10px;font-weight:800;color:var(--olive);margin-top:7px}
.popbody{max-height:65vh;overflow:auto}
.appt.hl{outline:2px solid var(--olive);background:var(--soft)}
.appt.dim{opacity:.6}
.calday{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;border:1px solid var(--line);border-radius:8px;min-height:56px;padding:6px;background:#fffaf3;font-size:10px;display:block;width:100%}
.calday:hover{background:var(--soft)}.calday:focus-visible{outline:2px solid var(--olive);outline-offset:1px}
.calday.today{border:2px solid var(--olive);background:#eef0d8}
.todaytag{font-style:normal;font-size:8px;font-weight:800;color:#fff;background:var(--olive);border-radius:99px;padding:1px 6px;margin-left:4px;vertical-align:1px}
.calcount{display:block;margin-top:4px;color:var(--olive);font-weight:700}
.dots{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%;background:var(--olive)}
.dot.s-requested,.dot.s-awaiting-payment{background:#c58b2a}.dot.s-completed{background:#8a8a78}.dot.s-no-show{background:#a94c3f}
@media(max-width:600px){.newbk{width:37px;height:37px;padding:0;justify-content:center;margin-right:2px}.newbk .lbl{display:none}.calday{min-height:46px;padding:4px}.calcount{font-size:9px}}

/* customer lookup */
.lookupbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:12px 0}
.lookupbar label{font-size:11px;font-weight:700;display:grid;gap:4px}
.lookupbar input{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffaf2;min-height:40px;color:var(--ink)}
.lookupbar input[name=q]{min-width:220px;flex:1}
.chips{display:flex;gap:6px;flex-wrap:wrap}
</style></head><body>
<div class="app"><aside class="side"><div class="brand"><span class="mark"></span>CENTRA</div><div class="biz">🚘 <b id="sideBiz"></b><small id="sideCity"></small></div><div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"></nav></div><div style="margin-top:auto"><div class="navlabel">ACCOUNT</div><nav class="nav" id="accountNav"></nav></div></aside>
<main class="main"><header class="top"><div class="crumb" id="crumb">Business management / Dashboard</div><div class="topright"><button class="btn primary newbk" data-act="manual" title="New booking" aria-label="New booking"><span aria-hidden="true">＋</span><span class="lbl">New booking</span></button><button class="iconbtn" id="sound" title="Toggle sound">♫</button><button class="iconbtn" id="bell" title="Notifications">♧<span class="badge hidden" id="badge">0</span></button><span class="ownerlabel"></span></div></header><div class="content" id="view"></div></main></div><nav class="bottomnav" id="bottomnav"></nav><div id="modal"></div><div id="toast"></div>
<script src="/static/scripts/api.js"></script>
<script>
const navItems=[["home","⌂","Dashboard"],["appointments","▦","Appointments"],["services","✧","Services"],["staff","♙","Staff"],["customers","♧","Customers"],["payments","₹","Payments"],["reports","▥","Reports"],["closures","◷","Business closures"],["profile","◇","Business profile"],["subscription","♕","Subscription"],["notifications","♧","Notifications"]];
const statuses=["Awaiting payment","Requested","Confirmed","Completed","Cancelled","Rejected","Expired","No-show","Refunded","Deposit forfeited"];
const state={page:"home",view:"list",filter:"All statuses",query:"",nfilter:"All",calMonth:null,loaded:false,business:{name:"",city:"",address:"",phone:"",slug:"",days:[],open:"09:00",close:"19:00",showPricing:true,logo:""},services:[],staff:[],appointments:[],customers:[],closures:[],festivals:[],festivalWarnings:[],notifications:[],deposits:false,depositPercent:10,refundWindow:"24",plan:"Base",billing:"Monthly",renewal:"",billingHistory:[],sound:true,payments:{total:0,held:0,refunds:0,payouts:0,recent:[]},reports:{bookings:0,cancellations:0,noShows:0,completed:0,busiest:[],topServices:[]},owner:{name:""},bookingUrl:"",today:"",lastNotificationId:0};
async function reload(){try{const d=await Centra.get("/api/dashboard/state");Object.assign(state,d,{loaded:true});render()}catch(e){if(e.status===401){location.href="/";return}if(e.code==="signup_incomplete"){location.href="/signup";return}toast(e.message)}}
async function call(p,msg){try{const r=await p;if(msg)toast(msg);await reload();return r}catch(e){toast(e.message);throw e}}
const fmtDate=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short"}):"";
const t12=t=>{if(!t)return"";let[h,m]=t.split(":").map(Number);return`${String(h%12||12).padStart(2,"0")}:${String(m).padStart(2,"0")} ${h<12?"AM":"PM"}`};

const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function toast(s){$("#toast").innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$("#toast").innerHTML="",2500)}function money(n){return"₹"+Number(n||0).toLocaleString("en-IN")}function suspended(o){return o.suspend==="forever"||!!(o.suspend&&new Date(o.suspend+"T23:59:59")>new Date())}function badge(s){return`<span class="status ${s.toLowerCase().replaceAll(" ","-")}">${esc(s)}</span>`}function unread(){return state.notifications.filter(n=>n.unread).length}
function nav(){let mk=items=>items.map(([id,ico,n])=>`<button class="${state.page===id?"active":""}" data-page="${id}">${ico} <span>${n}</span></button>`).join("");$("#nav").innerHTML=mk(navItems.slice(0,7));$("#accountNav").innerHTML=mk(navItems.slice(7))+`<button data-act="signout">⇥ <span>Sign out</span></button>`;$("#bottomnav").innerHTML=navItems.slice(0,5).concat([navItems[9]]).map(([id,ico,n])=>`<button class="${state.page===id?"active":""}" data-page="${id}"><span>${ico}</span>${n}</button>`).join("");$("#badge").textContent=unread();$("#badge").classList.toggle("hidden",!unread());$("#sideBiz").textContent=state.business.name;$("#sideCity").textContent=state.business.city;$("#sound").style.color=state.sound?"var(--olive)":"var(--muted)"}
function head(t,d,a=""){return`<div class="head"><div><div class="eyebrow">CENTRA BUSINESS MANAGEMENT</div><h1>${t}</h1><p class="lead">${d}</p></div>${a}</div>`}function stat(l,v,n,i,k){const inner=`<div class="statlabel">${l}<span>${i||"◦"}</span></div><div class="statvalue">${v}</div><div class="muted">${n}</div>`;return k?`<button type="button" class="stat clickable" data-act="card" data-key="${k}" aria-label="${esc(l)}: ${v}. View details">${inner}<div class="statgo">View ›</div></button>`:`<div class="stat">${inner}</div>`}
function appts(rows,link){return rows.length?`<div class="apptlist">${rows.map(a=>`<div class="appt${link&&DEAD.includes(a.status)?" dim":""}" data-appt="${a.id}"><div class="time">${esc(t12(a.time))}<small>${esc(fmtDate(a.date))} · ${esc(a.deposit)}</small></div><div><strong>${esc(a.customer)}</strong><small>${esc(a.service)} · ${esc(a.staff)}<br>${esc(a.phone)} · ${esc(a.code)}${link?`<br>${esc(srcLabel(a.source))}${a.note?" · "+esc(a.note):""}`:""}</small></div>${badge(a.status)}<div class="filters" style="grid-column:2/-1">${["Requested","Awaiting payment"].includes(a.status)?`<button class="btn primary small" data-act="status" data-id="${a.id}" data-value="confirmed">Confirm</button>`:""}${["Confirmed","Requested"].includes(a.status)?`<button class="btn secondary small" data-act="reschedule" data-id="${a.id}">Reschedule</button><button class="btn secondary small" data-act="status" data-id="${a.id}" data-value="completed">Complete</button><button class="btn secondary small" data-act="status" data-id="${a.id}" data-value="no_show">No-show</button>`:""}${["Confirmed","Requested","Awaiting payment"].includes(a.status)?`<button class="btn danger small" data-act="status" data-id="${a.id}" data-value="cancelled">Cancel</button>`:""}${ST_LOCKED.includes(a.statusCode)?"":`<button class="btn secondary small" data-act="changeStatus" data-id="${a.id}">Change status</button>`}${link?`<button class="btn secondary small" data-act="goAppt" data-id="${a.id}">Open in Appointments</button>`:""}</div></div>`).join("")}</div>`:`<div class="muted">No appointments match this filter.</div>`}
function dashboard(){let todays=state.appointments.filter(a=>a.date===state.today),active=todays.filter(a=>!["Cancelled","Rejected","Expired","Refunded","Deposit forfeited"].includes(a.status)),ss=state.services.filter(suspended).length,st=state.staff.filter(suspended).length;
let upcoming=state.appointments.filter(a=>a.date>state.today&&["Confirmed","Requested"].includes(a.status)).length;let hr=new Date().getHours(),greet=hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
return`${head(`${greet}${state.owner.name?", "+esc(state.owner.name.split(" ")[0]):""}`,`${esc(state.business.name)} · ${esc(state.business.city)}. Here’s what’s happening today.`)}${state.topSetup==="pending"?`<div class="alert"><span>◷</span><div style="flex:1"><b>WhatsApp setup in progress</b><br>We'll call you to connect your WhatsApp number.</div></div>`:""}<div class="grid stats">${stat("Today's bookings",cardRows("today").length,"Appointments on schedule","▦","today")}${stat("Cancellations",cardRows("cancel").length,"Today so far","⊗","cancel")}${stat("Upcoming",cardRows("upcoming").length,"Confirmed after today","◷","upcoming")}${stat("Awaiting action",cardRows("awaiting").length,"Requests to review","◌","awaiting")}</div><div class="panel"><div class="panelhead"><div><h2>Booking page</h2><p>Share your public booking page with customers.</p></div><span class="status confirmed">${state.planActive?"Live":"Plan expired"}</span></div><div class="linkbox"><span>↗</span><span class="linkurl" id="url">${esc(state.bookingUrl)}</span><button class="btn secondary small" data-act="copy">Copy</button><button class="btn secondary small" data-act="share">Share</button></div></div>${ss||st?`<div class="alert"><span>⚠</span><div style="flex:1"><b>Suspensions need your attention</b><br>${ss} service(s) and ${st} staff member(s) currently suspended.</div><button class="btn secondary small" data-page="services">Review</button></div>`:""}${state.festivalWarnings.length?`<div class="alert"><span>⚠</span><div style="flex:1"><b>Festival dates missing</b><br>No date is set yet for ${esc(state.festivalWarnings.join(", "))}, so customers can book on that day.</div></div>`:""}<div class="grid cols" style="margin-top:16px"><section class="panel"><div class="panelhead"><div><h2>Today's appointments</h2><p>In time order</p></div><button class="btn secondary small" data-page="appointments">View all →</button></div>${appts([...todays].sort((a,b)=>a.time.localeCompare(b.time)).slice(0,6))}</section><section class="panel"><div class="panelhead"><div><h2>Recent notifications</h2><p>Updates without refreshing</p></div><button class="btn secondary small" data-page="notifications">See all</button></div>${state.notifications.slice(0,4).map(n=>`<div class="itemrow"><div class="itemicon">${n.type==="Booking"?"▦":n.type==="Cancellation"?"⊗":"⚠"}</div><div class="itemmain"><strong>${esc(n.title)}</strong><small>${esc(n.body)} · ${esc(n.when)}</small></div></div>`).join("")||'<p class="muted">No notifications yet.</p>'}</section></div>`}
function appointments(){let q=state.query.toLowerCase();let rows=state.appointments.filter(a=>(state.filter==="All statuses"||a.status===state.filter)&&(!q||[a.customer,a.phone,a.service,a.staff,a.code].some(x=>String(x||"").toLowerCase().includes(q))));
rows=[...rows].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
let m=state.calMonth||state.today.slice(0,7),[yy,mm]=m.split("-").map(Number),first=new Date(yy,mm-1,1),days=new Date(yy,mm,0).getDate(),pad=first.getDay();
let counts={};state.appointments.filter(a=>!["Cancelled","Expired","Refunded","Deposit forfeited","Rejected"].includes(a.status)).forEach(a=>counts[a.date]=(counts[a.date]||0)+1);
let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div style="font-size:10px;font-weight:700;color:var(--muted)">${d}</div>`).join("")+Array.from({length:pad},()=>"<div></div>").join("")+Array.from({length:days},(_,i)=>{let iso=`${m}-${String(i+1).padStart(2,"0")}`,n=counts[iso]||0,isT=iso===state.today;return`<button type="button" class="calday${isT?" today":""}" data-act="day" data-date="${iso}" aria-label="${esc(fmtDate(iso))}${isT?", today":""}, ${n} booking${n===1?"":"s"}"><b>${i+1}</b>${isT?'<em class="todaytag">Today</em>':""}${n?`<span class="calcount">${n} booking${n>1?"s":""}</span><span class="dots">${dayDots(iso)}</span>`:""}</button>`}).join("");
return`${head("Appointments","Manage bookings, walk-ins, phone reservations and appointment status.")}<div class="panel"><div class="toolbar"><div class="tabs"><button class="${state.view==="list"?"active":""}" data-act="view" data-value="list">List</button><button class="${state.view==="calendar"?"active":""}" data-act="view" data-value="calendar">Calendar</button></div><div class="filters"><input placeholder="Search customer, phone, service or code" data-search value="${esc(state.query)}"><select data-filter>${["All statuses",...statuses].map(s=>`<option ${state.filter===s?"selected":""}>${s}</option>`).join("")}</select></div></div>${state.view==="list"?appts(rows):`<div class="toolbar"><button class="btn secondary small" data-act="calMonth" data-value="-1">‹</button><h2>${first.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h2><button class="btn secondary small" data-act="calMonth" data-value="1">›</button><button class="btn secondary small" data-act="calToday">Today</button></div><div class="grid" style="grid-template-columns:repeat(7,1fr);gap:5px;margin-top:15px">${cells}</div>${`${m}-${String(days).padStart(2,"0")}`<addDays(state.today,-30)?'<p class="muted" style="margin-top:10px">Bookings are loaded from the last 30 days onward, so earlier days may look empty.</p>':""}`}<p class="muted" style="margin-top:14px">Slot rule: service interval creates candidate slots; staff hours, breaks, leave and existing bookings filter availability.</p></div>`}

function services(){return`${head("Services","Manage service catalogue, prices, durations, slot intervals and suspensions.",`<button class="btn primary" data-act="addService">＋ Add service</button>`)}<div class="panel"><div class="toolbar"><input placeholder="Search services" data-search aria-label="Search services" value="${esc(state.query)}"><div class="tabs">${[["all","All ("+state.services.length+")"],["shown","Shown"],["hidden","Hidden"],["suspended","Suspended"]].map(([v,l])=>`<button class="${(state.sf||"all")===v?"active":""}" data-act="sf" data-value="${v}">${l}</button>`).join("")}</div><span class="status">${svcList(state.sf||"all").length} of ${state.services.length} services</span><label class="filters"><input type="checkbox" data-input="pricing" ${state.business.showPricing?"checked":""}> Show prices publicly</label></div><div id="serviceRows">${serviceRows(state.sf||"all")}</div></div>`}
function svcList(f){const w=state.query.toLowerCase().split(/\s+/).filter(Boolean);return state.services.filter(s=>(f==="shown"?s.shown:f==="hidden"?!s.shown:f==="suspended"?suspended(s):true)&&w.every(x=>s.name.toLowerCase().includes(x)))}
function serviceRows(f){let xs=svcList(f);return xs.map(s=>`<div class="itemrow"><div class="itemicon">✧</div><div class="itemmain"><strong>${esc(s.name)} ${suspended(s)?badge("Cancelled").replace("Cancelled","Suspended"):""}</strong><small>${s.duration} min duration · ${s.interval} min slot interval · ${s.shown?"Shown":"Hidden"}${s.suspend?" · Suspended "+(s.suspend==="forever"?"until turned back on":"until "+esc(fmtDate(s.suspend))):""}</small></div><div class="itemend">${money(s.price)}<small>per service</small></div><button class="switch ${s.shown?"on":""}" title="Toggle visibility" data-act="toggleService" data-id="${s.id}"></button><button class="btn secondary small" data-act="editService" data-id="${s.id}">Edit</button><button class="btn secondary small" data-act="suspendService" data-id="${s.id}">${suspended(s)?"Resume":"Suspend"}</button></div>`).join("")||`<div class="muted">${state.query?"No service matches “"+esc(state.query)+"”.":"Nothing in this view."}</div>`}
function staff(){return`${head("Staff","Team availability, schedules, breaks, leave and temporary suspensions. Staff have no separate logins.",`<button class="btn primary" data-act="addStaff">＋ Add staff</button>`)}<div class="panel"><div class="toolbar"><div class="tabs"><button class="active" data-act="tf" data-value="all">All</button><button data-act="tf" data-value="active">Active</button><button data-act="tf" data-value="suspended">Suspended</button></div><span class="muted">Managed by the owner</span></div>${state.staff.map(s=>`<div class="itemrow"><div class="itemicon">♙</div><div class="itemmain"><strong>${esc(s.name)} · ${esc(s.role)} ${suspended(s)?badge("Cancelled").replace("Cancelled","Suspended"):badge("Confirmed").replace("Confirmed","Active")}</strong><small>${s.days.join(", ")} · ${s.start}–${s.end}<br>${s.bs?`Break ${s.bs}–${s.be}`:"No break"}${(s.leave||[]).length?` · ${s.leave.length} leave day(s) coming up`:""}${s.suspend?" · Suspended "+(s.suspend==="forever"?"until turned back on":"until "+esc(fmtDate(s.suspend))):""}</small></div><button class="btn secondary small" data-act="editStaff" data-id="${s.id}">Edit</button><button class="btn secondary small" data-act="leave" data-id="${s.id}">Leave</button><button class="btn secondary small" data-act="suspendStaff" data-id="${s.id}">${suspended(s)?"Resume":"Suspend"}</button></div>`).join("")}</div>`}
function profile(){let b=state.business;return`${head("Business profile","Edit the public business details customers see on your booking page.")}<div class="panel"><div style="display:flex;align-items:center;gap:15px;margin-bottom:18px"><div id="logoPreview" class="itemicon" style="width:65px;height:65px">${b.logo?`<img class="logoimg" src="${b.logo}">`:"🚘"}</div><div><b>${esc(b.name)}</b><p class="muted">Upload a PNG logo</p><input type="file" accept="image/png" id="logoFile"></div></div><form id="profileForm"><div class="formgrid"><div class="field"><label>Business name</label><input name="name" value="${esc(b.name)}" required></div><div class="field"><label>City</label><input name="city" value="${esc(b.city)}" required></div><div class="field full"><label>Address</label><input name="address" value="${esc(b.address)}" required></div>${Array.from({length:state.areasLimit||3},(_,i)=>`<div class="field"><label>${i===0?"Area 1: your area / locality":"Area "+(i+1)+": nearby area (optional)"}</label><input name="area" value="${esc((b.areas||[])[i]||"")}" ${i===0?"required":""} maxlength="60" placeholder="${i===0?"e.g. Madhapur":"e.g. Hitech City"}"></div>`).join("")}<div class="field full"><small class="muted">You appear in AI-assistant searches for these areas (up to ${state.areasLimit||3}).</small></div><div class="field"><label>Phone</label><input name="phone" value="${esc(b.phone)}"></div><div class="field"><label>Booking slug</label><input name="slug" pattern="[a-z0-9\\-]+" value="${esc(b.slug)}" required><small class="muted">${esc(location.host)}/${esc(b.slug)}</small></div><div class="field"><label>Opening time</label><input name="open" type="time" value="${b.open}"></div><div class="field"><label>Closing time</label><input name="close" type="time" value="${b.close}"></div><div class="field full"><label>Working days</label><div class="days">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<label class="day ${b.days.includes(d)?"on":""}"><input type="checkbox" name="days" value="${d}" ${b.days.includes(d)?"checked":""} style="min-height:auto">${d}</label>`).join("")}</div></div></div><button class="btn primary">Save changes</button></form></div>`}
function customers(){let xs=state.customers.filter(c=>{const q=state.query.toLowerCase().trim(),qd=q.replace(/\D/g,"");return!q||(c.name+" "+c.phone+" "+c.email).toLowerCase().includes(q)||(qd.length>=3&&String(c.phone||"").replace(/\D/g,"").includes(qd))});
return`${head("Customers","Customer directory, contact details, booking history and notes.")}<div class="panel"><div class="panelhead"><div><h2>Customer lookup</h2><p>Find a customer by name, phone or email and see how many times they booked and the status of every booking. Choose dates to list only customers with an appointment in that range.</p></div></div><form id="lookupForm" class="lookupbar"><input name="q" placeholder="Name, phone or email" aria-label="Name, phone or email" value="${esc((state.lookup||{}).q||"")}"><label>From<input type="date" name="from" value="${esc((state.lookup||{}).from||"")}"></label><label>To<input type="date" name="to" value="${esc((state.lookup||{}).to||"")}"></label><button class="btn primary">Look up</button><button type="button" class="btn secondary" data-act="lookupClear">Clear</button></form><div id="lookupOut">${lookupHtml()}</div></div><div class="panel" style="margin-top:15px"><div class="toolbar"><input placeholder="Search by name, phone or email" data-search value="${esc(state.query)}"><span class="status">${state.customers.length} customers</span></div><div class="tablewrap"><table class="table"><thead><tr><th>Customer</th><th>Phone</th><th>Bookings</th><th>Last booking</th><th>Notes</th><th></th></tr></thead><tbody>${xs.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small class="muted">${esc(c.email.endsWith("@no-email.centra")?"":c.email)}</small></td><td>${esc(c.phone)}</td><td>${c.bookings}</td><td>${esc(c.last)}</td><td>${esc(c.notes||"—")}</td><td><button class="btn secondary small" data-act="notes" data-id="${c.id}">Edit notes</button></td></tr>`).join("")}</tbody></table></div>${xs.length?"":'<p class="muted">Customers appear here after their first booking.</p>'}<button class="btn secondary" style="margin-top:12px" data-act="export">Export customer CSV</button></div>`}
function payments(){const p=state.payments;return`${head("Payments & deposits","Configure deposits and review payment history, refunds and business payouts.")}<div class="grid stats">${stat("Deposits collected",money(p.total),"All time","₹")}${stat("Deposits held",money(p.held),"For upcoming bookings","◷")}${stat("Refunds",money(p.refunds),"Returned to customers","↶")}${stat("Payouts",money(p.payouts),"Due to your business","↗")}</div><div class="grid cols"><section class="panel"><h2>Deposit settings</h2><p class="muted">Charge a deposit to hold a booking slot.</p><p><label><input type="checkbox" data-input="deposits" ${state.deposits?"checked":""}> Enable deposits</label></p><div class="field"><label>Deposit percentage</label><select data-input="percent">${[5,10,15,20,25,30,50].map(n=>`<option ${n===state.depositPercent?"selected":""}>${n}</option>`).join("")}</select></div><div class="field"><label>Full refund cancellation window</label><select data-input="refund">${[6,12,24,48,72].map(n=>`<option value="${n}" ${String(n)===state.refundWindow?"selected":""}>Up to ${n} hours before slot</option>`).join("")}</select></div><button class="btn primary" data-act="saveDeposits">Save settings</button><p class="notice">Deposits are collected by CENTRA through Razorpay and paid out to your business. Automatic split payouts (Razorpay Route) switch on once Razorpay approves the account.</p></section><section class="panel"><h2>Recent payment activity</h2><div class="tablewrap" style="margin-top:14px"><table class="table"><thead><tr><th>Customer</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead><tbody>${p.recent.map(r=>`<tr><td>${esc(r.customer)}</td><td>${esc(r.when)}</td><td>${money(r.amount)}</td><td>${badge(r.status==="Paid"?"Confirmed":r.status==="Pending"?"Awaiting payment":r.status).replace(">Confirmed<",">Paid<")}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">No payments yet.</td></tr>'}</tbody></table></div></section></div>`}
function reports(){const r=state.reports;return`${head("Reports","Understand demand, service performance and customer retention. Last 30 days.")}<div class="grid stats">${stat("Bookings",cardRows("rbook").length,"Last 30 days","▦","rbook")}${stat("Cancellations",cardRows("rcancel").length,repPct(cardRows("rcancel").length),"⊗","rcancel")}${stat("No-shows",cardRows("rnoshow").length,repPct(cardRows("rnoshow").length),"♙","rnoshow")}${stat("Completed",cardRows("rdone").length,repPct(cardRows("rdone").length),"✓","rdone")}</div><div class="grid cols"><section class="panel"><h2>Busiest days</h2><div class="chart">${r.busiest.map(([d,h,n])=>`<div class="barwrap" title="${n} bookings"><div class="bar" style="height:${Math.max(h,2)}%"></div><span>${d}</span></div>`).join("")}</div></section><section class="panel"><h2>Top services</h2>${r.topServices.map(([n,v,w])=>`<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:6px">${esc(n)}<b>${v}</b></div><div style="height:7px;background:#e9e2d3;border-radius:8px"><div style="height:100%;width:${w}%;background:var(--olive);border-radius:8px"></div></div></div>`).join("")||'<p class="muted">No bookings in this period yet.</p>'}</section></div><div class="grid stats" style="margin-top:15px">${stat("Repeat customers",cardRows("rrepeat").length,"Booked 2+ times in 30 days","♧","rrepeat")}${stat("Customers",cardRows("rcust").length,"Booked in 30 days","◦","rcust")}</div>`}
function subscription(){return`${head("Subscription","Manage your plan, renewal, billing history and pack preferences.")}<div class="grid cols"><section class="panel"><h2>Current plan</h2><div class="plan selected" style="margin-top:14px"><span class="status ${state.planActive?"confirmed":"cancelled"}">${state.planActive?"ACTIVE":"EXPIRED"}</span><div class="price">${state.plan} Plan</div><p class="muted">${state.plan==="Top"?"Booking, management and WhatsApp receptionist.":"Manage bookings, services, staff and customers."}</p><div class="divider"></div><p class="muted">Active until: <b>${esc(state.renewal)}</b></p><p class="muted">Billing: ${esc(state.billing)}</p><button class="btn primary" data-act="renew" data-value="${state.billing==="Monthly"?"monthly":"pack"}">Renew plan</button> <button class="btn secondary" data-act="switchPack">Switch pack</button></div></section><section class="panel"><h2>Upgrade to Top</h2><p class="muted">WhatsApp receptionist, knowledge approvals and priority support.</p><div class="plan"><div class="price">Top</div><ul class="muted"><li>WhatsApp AI receptionist</li><li>Knowledge management</li><li>Priority support</li></ul><p class="notice">Top is available for Meta-verified businesses. Upgrades from the dashboard are coming soon; contact ${esc(state.supportEmail||"support")} to upgrade now.</p></div></section></div><section class="panel" style="margin-top:15px"><h2>Billing history</h2><div class="tablewrap" style="margin-top:13px"><table class="table"><thead><tr><th>Invoice</th><th>Date</th><th>Plan</th><th>Amount</th><th>Status</th></tr></thead><tbody>${state.billingHistory.map(b=>`<tr><td>${esc(b.invoice)}</td><td>${esc(b.date)}</td><td>${esc(b.plan)}<br><small class="muted">${esc(b.period)}</small></td><td>${money(b.amount)}</td><td>${badge("Confirmed").replace(">Confirmed<",">Paid<")}</td></tr>`).join("")||'<tr><td colspan="5" class="muted">No invoices yet.</td></tr>'}</tbody></table></div></section>`}
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
function closureText(c){const ord=n=>n+(n%10===1&&n!==11?"st":n%10===2&&n!==12?"nd":n%10===3&&n!==13?"rd":"th");return c.type==="range"?`Closed from ${esc(fmtDate(c.start))} through ${esc(fmtDate(c.end))} (inclusive)`:c.type==="weekly"?`Every ${esc(c.weekday)}`:c.type==="monthly"?`Every ${ord(Number(c.day))} of the month`:c.type==="yearly"?`Every year on ${Number(c.day)} ${MONTHS[c.month-1]}`:`Every year on ${esc(c.festivalLabel)} (date changes each year)`}
const CTYPE={range:["▣","Date range"],weekly:["↻","Weekly"],monthly:["◷","Monthly"],yearly:["✦","Yearly"],festival:["✺","Festival"]};
function closures(){return`${head("Closed for business","Set one-off closure periods, recurring weekly days off, a date each month, a date each year, or a festival.",`<button class="btn primary" data-act="addClosure">＋ Add closure</button>`)}
<div class="grid stats">${stat("Closure rules",cardRows("cl_all").length,"One-off and recurring","◷","cl_all")}${stat("Recurring rules",cardRows("cl_rec").length,"Weekly / monthly / yearly","↻","cl_rec")}${stat("One-off periods",cardRows("cl_one").length,"Date ranges","▣","cl_one")}${stat("Booking protection","ON","Closed dates block availability","✓")}</div>
<div class="panel"><div class="panelhead"><div><h2>Closure schedule</h2><p>Customers can't book during these dates or recurring closures.</p></div><span class="status confirmed">Booking protection enabled</span></div>
${state.closures.map(c=>`<div class="itemrow"><div class="itemicon">${CTYPE[c.type][0]}</div><div class="itemmain"><strong>${esc(c.label)}</strong><small>${closureText(c)}${c.note?" · "+esc(c.note):""}</small></div><span class="status">${CTYPE[c.type][1]}</span><button class="btn secondary small" data-act="editClosure" data-id="${c.id}">Edit</button><button class="btn danger small" data-act="deleteClosure" data-id="${c.id}">Remove</button></div>`).join("")}
${state.closures.length?"":'<p class="muted">No closure rules configured. Your business is available according to its regular hours.</p>'}
<div class="notice"><b>How dates work:</b> date ranges include both the start and end date. Weekly rules repeat on the selected weekday, monthly rules on the selected day number, yearly rules on the same date every year. Festival dates (like Diwali) move each year and are kept up to date by CENTRA. If a business closes on a day that already has bookings, it contacts those customers directly.</div></div>`}
function closureForm(c={}){const t=c.type||"range";const opt=(v,l)=>`<option value="${v}" ${t===v?"selected":""}>${l}</option>`;
modal(c.id?"Edit closure":"Add closure",`<form id="closureForm" data-id="${c.id||""}"><div class="field"><label>Closure type</label><select name="type" id="closureType">${opt("range","Specific date range")}${opt("weekly","Every week on a day")}${opt("monthly","Every month on a date")}${opt("yearly","Every year on a date")}${opt("festival","Every year on a festival")}</select></div><div class="field"><label>Label</label><input name="label" required maxlength="80" value="${esc(c.label||"")}" placeholder="e.g. Annual holiday, weekly day off"></div><div id="rangeFields" class="${t==="range"?"":"hidden"}"><div class="formgrid"><div class="field"><label>Closed from (inclusive)</label><input type="date" name="start" value="${esc(c.start||state.today)}"></div><div class="field"><label>Closed through (inclusive)</label><input type="date" name="end" value="${esc(c.end||state.today)}"></div></div></div><div id="weeklyFields" class="${t==="weekly"?"":"hidden"}"><div class="field"><label>Repeat every</label><select name="weekday">${["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"].map(d=>`<option ${c.weekday===d?"selected":""}>${d}</option>`).join("")}</select></div></div><div id="monthlyFields" class="${t==="monthly"?"":"hidden"}"><div class="field"><label>Repeat on day of month</label><select name="day">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option ${Number(c.day||15)===d?"selected":""}>${d}</option>`).join("")}</select></div></div><div id="yearlyFields" class="${t==="yearly"?"":"hidden"}"><div class="formgrid"><div class="field"><label>Day</label><select name="yday">${Array.from({length:31},(_,i)=>i+1).map(d=>`<option ${Number(c.day||1)===d?"selected":""}>${d}</option>`).join("")}</select></div><div class="field"><label>Month</label><select name="month">${MONTHS.map((n,i)=>`<option value="${i+1}" ${Number(c.month||1)===i+1?"selected":""}>${n}</option>`).join("")}</select></div></div></div><div id="festivalFields" class="${t==="festival"?"":"hidden"}"><div class="field"><label>Festival</label><select name="festival">${state.festivals.map(f=>`<option value="${esc(f.key)}" ${c.festival===f.key?"selected":""}>${esc(f.label)}</option>`).join("")}</select><small class="muted">The date is updated for you every year.</small></div></div><div class="field"><label>Note (optional)</label><input name="note" maxlength="255" value="${esc(c.note||"")}"></div><button class="btn primary">Save closure</button></form>`)}

const fmtDateY=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}):"";
const stChips=m=>Object.entries(m||{}).map(([l,n])=>`<span class="status ${l.toLowerCase().replaceAll(" ","-")}">${n} ${esc(l)}</span>`).join("");
function lookupHtml(){const L=state.lookup;if(!L)return'<p class="muted">Type a name or phone number, or choose dates, then press Look up.</p>';
 if(L.loading)return'<p class="muted">Looking up…</p>';const r=L.res;if(!r||!r.customers.length)return'<p class="muted">No customers match.</p>';
 return r.customers.map(c=>`<div class="itemrow"><div class="itemmain"><strong>${esc(c.name)}</strong><small>${esc(c.phone)}${c.email?" · "+esc(c.email):""}${c.names.length>1?"<br>Also booked as: "+c.names.filter(n=>n!==c.name).map(esc).join(", "):""}<br>Last booking ${esc(fmtDateY(c.last))}</small></div><div class="itemend"><b>${c.total}×</b><small>booked</small></div><div class="chips">${stChips(c.statuses)}</div><button class="btn secondary small" data-act="custHistory" data-value="${esc(c.key)}">View bookings</button></div>`).join("")+(r.truncated?`<p class="muted">Showing the ${r.customers.length} most recent of ${r.matched} matches. Narrow your search to see the rest.</p>`:"")}
async function runLookup(q,from,to){state.lookup={q,from,to,loading:true,res:null};render();
 try{const r=await Centra.get("/api/dashboard/customers/lookup?"+new URLSearchParams({q,date_from:from,date_to:to}));state.lookup={q,from,to,res:r}}

async function openHistory(key){try{const r=await Centra.get("/api/dashboard/customers/history?key="+encodeURIComponent(key)),c=((state.lookup||{}).res||{customers:[]}).customers.find(x=>x.key===key),n={};r.bookings.forEach(b=>n[b.status]=(n[b.status]||0)+1);
 modal("Bookings · "+esc(c?c.name:"Customer"),`<p class="muted">${r.bookings.length} booking${r.bookings.length===1?"":"s"} · ${stChips(n)||"none"}</p><div class="popbody">${r.bookings.length?`<div class="apptlist">${r.bookings.map(b=>`<div class="appt"><div class="time">${esc(t12(b.time))}<small>${esc(fmtDateY(b.date))}</small></div><div><strong>${esc(b.services||"—")}</strong><small>${esc(b.staff)} · ${esc(b.code)}${c&&b.name&&b.name!==c.name?" · booked as "+esc(b.name):""}</small></div>${badge(b.status)}<div class="filters" style="grid-column:2/-1">${byid(state.appointments,b.id)?`<button class="btn secondary small" data-act="goAppt" data-id="${b.id}">Open in Appointments</button>`:'<span class="muted">Older booking</span>'}</div></div>`).join("")}</div>`:'<p class="muted">No bookings.</p>'}</div>`)}catch(e){toast(e.message)}}
/* ===== Cards, popups, calendar helpers ===== */
const DEAD=["Cancelled","Rejected","Expired","Refunded","Deposit forfeited"];
const srcLabel=s=>({ai:"AI assistant",manual:"Manual booking"})[s]||"Booking page";
const pad2=n=>String(n).padStart(2,"0");
function addDays(iso,n){const d=new Date(iso+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function rep30(){const t=state.today,lo=addDays(t,-30),hi=addDays(t,1);return state.appointments.filter(a=>a.date>=lo&&a.date<=hi&&!["Expired","Awaiting payment"].includes(a.status))}
function repPct(n){const t=rep30().length;return t?(n/t*100).toFixed(1)+"% of bookings":"No bookings yet"}
function repCustomers(){const m=new Map();rep30().forEach(a=>{const k=a.email||a.phone,c=m.get(k)||{name:a.customer,phone:a.phone,email:a.email,n:0,last:""};c.n++;if(a.date>c.last)c.last=a.date;m.set(k,c)});return[...m.values()].sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name))}
const CARD={today:["Today's bookings","No appointments today."],cancel:["Cancellations today","No cancellations today."],upcoming:["Upcoming bookings","Nothing upcoming yet."],awaiting:["Awaiting action","Nothing is waiting for your review."],
rbook:["Bookings · last 30 days","No bookings in this period."],rcancel:["Cancellations · last 30 days","No cancellations in this period."],rnoshow:["No-shows · last 30 days","No no-shows in this period."],rdone:["Completed · last 30 days","Nothing completed in this period."],
rrepeat:["Repeat customers · last 30 days","No repeat customers yet."],rcust:["Customers · last 30 days","No customers in this period."],
cl_all:["Closure rules","No closure rules configured."],cl_rec:["Recurring closures","No recurring closures."],cl_one:["One-off closure periods","No one-off closures."]};
function cardRows(k){const A=state.appointments,t=state.today,R=()=>rep30();return({
 today:()=>A.filter(a=>a.date===t&&!DEAD.includes(a.status)),
 cancel:()=>A.filter(a=>a.date===t&&["Cancelled","Refunded","Deposit forfeited"].includes(a.status)),
 upcoming:()=>A.filter(a=>a.date>t&&["Confirmed","Requested"].includes(a.status)),
 awaiting:()=>A.filter(a=>["Requested","Awaiting payment"].includes(a.status)),
 rbook:()=>R(),rcancel:()=>R().filter(a=>["Cancelled","Refunded","Deposit forfeited"].includes(a.status)),
 rnoshow:()=>R().filter(a=>a.status==="No-show"),rdone:()=>R().filter(a=>a.status==="Completed"),
 rrepeat:()=>repCustomers().filter(c=>c.n>=2),rcust:()=>repCustomers(),
 cl_all:()=>state.closures,cl_rec:()=>state.closures.filter(c=>c.type!=="range"),cl_one:()=>state.closures.filter(c=>c.type==="range")})[k]()}
const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
function openCard(k){const M=CARD[k];if(!M)return;const show=()=>{let rows=cardRows(k),body;
 if(!rows.length)body=`<p class="muted">${M[1]}</p>`;
 else if(k==="rrepeat"||k==="rcust")body=rows.map(c=>`<div class="itemrow"><div class="itemmain"><strong>${esc(c.name)}</strong><small>${esc(c.phone)}${c.email&&!c.email.endsWith("@no-email.centra")?" · "+esc(c.email):""}<br>${c.n} booking${c.n>1?"s":""} · last ${esc(fmtDate(c.last))}</small></div><button class="btn secondary small" data-act="goCust" data-value="${esc(c.phone||c.email)}">Open in Customers</button></div>`).join("");
 else if(k.startsWith("cl_"))body=rows.map(c=>`<div class="itemrow"><div class="itemmain"><strong>${esc(c.label)}</strong><small>${closureText(c)}${c.note?" · "+esc(c.note):""}</small></div><button class="btn secondary small" data-act="editClosure" data-id="${c.id}">Edit</button></div>`).join("");
 else body=appts([...rows].sort(byTime),true);
 modal(M[0]+" · "+rows.length,`<div class="popbody">${body}</div>`);state.popup=show};show()}
function goAppt(id){const a=byid(state.appointments,id);close();state.page="appointments";state.view="list";state.filter="All statuses";state.query="";render();window.scrollTo({top:0});
 setTimeout(()=>{const el=document.querySelector(`[data-appt="${id}"]`);if(el){el.scrollIntoView({block:"center",behavior:"smooth"});el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),3500)}else if(a){state.query=a.code;render()}},60)}
function dayDots(iso){return state.appointments.filter(a=>a.date===iso&&!DEAD.includes(a.status)).slice(0,6).map(a=>`<i class="dot s-${a.status.toLowerCase().replaceAll(" ","-")}"></i>`).join("")}
function openDay(iso){const show=()=>{const rows=state.appointments.filter(a=>a.date===iso).sort(byTime),live=rows.filter(a=>!DEAD.includes(a.status)),gone=rows.filter(a=>DEAD.includes(a.status));
 const title=new Date(iso+"T12:00:00").toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})+(iso===state.today?" · Today":"");
 modal(title,`<div class="popbody">${rows.length?appts(live.concat(gone),true):'<p class="muted">No appointments on this day.</p>'}</div>`);state.popup=show};show()}
/* ===== Change status popup ===== */
const ST_OPTS=[["confirmed","Confirmed"],["completed","Completed"],["no_show","No-show"],["cancelled","Cancelled"],["rejected","Denied"]];
const ST_LOCKED=["expired","refunded","deposit_forfeited"];
function stAllowed(cur){return cur==="awaiting_payment"?["confirmed","cancelled","rejected"]:ST_OPTS.map(o=>o[0]).filter(v=>v!==cur)}
function stHint(cur,to){const gone=["cancelled","rejected"].includes(cur);
 if(to==="cancelled"||to==="rejected")return gone?"Only the label changes. The customer isn't emailed again.":"The customer is emailed. A paid deposit is refunded.";
 if(to==="no_show")return"A paid deposit is forfeited.";
 if(to==="confirmed"&&gone)return"The time slot is checked again first. The customer isn't notified automatically.";
 if(to==="confirmed"&&cur==="no_show")return"The time slot is checked again if it's still upcoming. A forfeited deposit is restored.";
 if(to==="confirmed"&&cur==="completed")return"The time slot is checked again if it's still upcoming.";
 if(to==="completed"&&cur==="no_show")return"A forfeited deposit is restored.";
 return""}
function openStatus(x){if(!x)return;const cur=x.statusCode,allowed=stAllowed(cur);
 modal("Change status",`<form id="statusForm" data-id="${x.id}" data-cur="${cur}"><p class="muted">${esc(x.customer)} · ${esc(fmtDate(x.date))}, ${esc(t12(x.time))} · ${esc(x.code)}<br>Current status: <b>${esc(x.status)}</b></p><div class="stopts" role="radiogroup" aria-label="New status">${ST_OPTS.map(([v,l])=>{const off=!allowed.includes(v);return`<label class="stopt${off?" off":""}"><input type="radio" name="status" value="${v}"${off?" disabled":""}><span>${l}</span>${v===cur?'<small class="muted">Current</small>':""}</label>`}).join("")}</div><p class="muted" id="stHint" aria-live="polite">Choose the new status, then press Save.</p><button class="btn primary" id="stSave" disabled>Save</button></form>`)}
document.addEventListener("change",e=>{const t=e.target,f=t.closest&&t.closest("#statusForm");if(f&&t.name==="status"){$("#stSave").disabled=false;$("#stHint").textContent=stHint(f.dataset.cur,t.value)||"Press Save to apply."}});
/* ===== Manual booking: multi-service picker ===== */
const mp={sel:[],q:""};
const mpSingle=()=>state.business.allowMultiple===false;
function mpDate(){const d=$("#manualForm [name=date]");return d&&d.value?d.value:state.today}
function mpAvailable(){const d=mpDate();return state.services.filter(s=>s.shown&&!(s.suspend==="forever"||(s.suspend&&d<=s.suspend)))}
function mpDur(m){return m>=60?Math.floor(m/60)+" hr"+(m%60?" "+(m%60)+" min":""):m+" min"}
function mpIds(){const ok=new Set(mpAvailable().map(s=>s.id));return mp.sel.filter(id=>ok.has(id))}
function mpOpen(){mp.sel=[];mp.q="";mpRender()}
function mpInvalid(){$("#mpField")?.classList.add("bad");toast(mpSingle()?"Choose a service.":"Choose at least one service.");$("#mpSearch")?.focus()}
function mpRender(keepList){
 const list=$("#mpList");if(!list)return;
 const avail=mpAvailable(),ids=mpIds(),dropped=mp.sel.length-ids.length;
 mp.sel=ids;
 if(dropped>0)toast(dropped+(dropped>1?" services were":" service was")+" removed because "+(dropped>1?"they are":"it is")+" not available on that date");
 if(!keepList||dropped>0){
  const words=mp.q.toLowerCase().split(/\s+/).filter(Boolean);
  const hits=avail.filter(s=>words.every(w=>s.name.toLowerCase().includes(w)));
  const shown=hits.slice(0,200);
  list.innerHTML=!avail.length?`<div class="mpempty muted">No services can be booked on this date. Check the Hidden and Suspended tabs in Services.</div>`
   :!hits.length?`<div class="mpempty muted">No service matches “${esc(mp.q)}”.</div>`
   :shown.map(s=>`<label class="mprow"><input type="${mpSingle()?"radio":"checkbox"}" name="svc" value="${s.id}" ${mp.sel.includes(s.id)?"checked":""}><span class="mpname">${esc(s.name)}</span><span class="muted">${mpDur(s.duration)} · ${money(s.price)}</span></label>`).join("")
    +(hits.length>shown.length?`<div class="mpempty muted">Showing ${shown.length} of ${hits.length}. Type more to narrow the list.</div>`:"");
 }
 const picked=mp.sel.map(id=>state.services.find(s=>s.id===id)).filter(Boolean);
 $("#mpChips").innerHTML=picked.map(s=>`<span class="mpchip">${esc(s.name)}<button type="button" data-mp-del="${s.id}" aria-label="Remove ${esc(s.name)}">×</button></span>`).join("");
 $("#mpCount").textContent=picked.length?"("+picked.length+" selected)":"";
 $("#mpSum").textContent=picked.length?picked.length+(picked.length>1?" services":" service")+" · "+mpDur(picked.reduce((a,s)=>a+s.duration,0))+" · "+money(picked.reduce((a,s)=>a+s.price,0)):(mpSingle()?"Choose one service.":"Tick one or more services.");
 if(picked.length)$("#mpField").classList.remove("bad");
}
document.addEventListener("input",e=>{if(e.target.id==="mpSearch"){mp.q=e.target.value;mpRender()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="mpSearch")e.preventDefault()});
document.addEventListener("change",e=>{const t=e.target;
 if(t.name==="svc"&&t.closest("#mpList")){const id=+t.value;if(mpSingle())mp.sel=[id];else if(t.checked){if(!mp.sel.includes(id))mp.sel.push(id)}else mp.sel=mp.sel.filter(x=>x!==id);mpRender(true)}
 else if(t.name==="date"&&t.closest("#manualForm"))mpRender()});
document.addEventListener("click",e=>{const b=e.target.closest("[data-mp-del]");if(b){mp.sel=mp.sel.filter(x=>x!==+b.dataset.mpDel);mpRender()}});
document.addEventListener("submit",e=>{e.preventDefault();let f=e.target,d=new FormData(f);
 if(f.id==="closureForm"){let type=d.get("type"),body={type,label:(d.get("label")||"").trim(),note:(d.get("note")||"").trim()};
  if(type==="range"){body.start=d.get("start");body.end=d.get("end");if(!body.start||!body.end||body.end<body.start){toast("Choose a valid date range");return}}
  if(type==="weekly")body.weekday=d.get("weekday");if(type==="monthly")body.day=+d.get("day");if(type==="yearly"){body.day=+d.get("yday");body.month=+d.get("month")}if(type==="festival")body.festival=d.get("festival");
  call(f.dataset.id?Centra.put(`/api/dashboard/closures/${f.dataset.id}`,body):Centra.post("/api/dashboard/closures",body),"Closure schedule saved").then(()=>{close();state.page="closures";render()},()=>{})}
 if(f.id==="lookupForm"){runLookup((d.get("q")||"").trim(),d.get("from")||"",d.get("to")||"");return}
if(f.id==="statusForm"){const v=d.get("status"),id=f.dataset.id,live=!["cancelled","rejected"].includes(f.dataset.cur);if(!v)return;
 if(live&&v==="cancelled"&&!confirm("Cancel this booking? The customer will be emailed and any deposit paid will be refunded."))return;
 if(live&&v==="rejected"&&!confirm("Deny this booking? The customer will be emailed and any deposit paid will be refunded."))return;
 const btn=$("#stSave");btn.disabled=true;
 Centra.post(`/api/dashboard/appointments/${id}/status`,{status:v}).then(async r=>{close();toast(({confirmed:"Booking confirmed",completed:"Marked completed",no_show:"Marked no-show",cancelled:"Booking cancelled",rejected:"Booking denied"})[v]+(r&&r.note?" · "+r.note:""));await reload()}).catch(err=>{btn.disabled=false;toast(err.message)});return}
 if(f.id==="manualForm"){const ids=mpIds();if(!ids.length){mpInvalid();return}const body={customer:d.get("customer"),phone:d.get("phone"),email:d.get("email")||"",service_ids:ids,staff:d.get("staff"),date:d.get("date"),time:d.get("time"),status:d.get("status")};
  const done=()=>{toast("Manual booking created");close();state.page="appointments";reload()};
  Centra.post("/api/dashboard/appointments",body).then(done,e=>{
   if(e.code==="staff_unavailable_day"){if(confirm(e.message+"\n\nContinue with the booking anyway?"))Centra.post("/api/dashboard/appointments",{...body,override:true}).then(done,e2=>toast(e2.message))}
   else toast(e.message)})}
 const svc=()=>({name:d.get("name"),price:+d.get("price")||0,duration:+d.get("duration"),interval:+d.get("interval")});
 if(f.id==="newService")call(Centra.post("/api/dashboard/services",svc()),"Service added").then(close,()=>{});
 if(f.id==="editService")call(Centra.put(`/api/dashboard/services/${f.dataset.id}`,svc()),"Service saved").then(close,()=>{});
 const stf=()=>({name:d.get("name"),role:d.get("role")||"",start:d.get("start"),end:d.get("end"),bs:d.get("bs")||"",be:d.get("be")||"",days:d.getAll("days")});
 if(f.id==="newStaff")call(Centra.post("/api/dashboard/staff",stf()),"Staff added").then(close,()=>{});
 if(f.id==="editStaff")call(Centra.put(`/api/dashboard/staff/${f.dataset.id}`,stf()),"Staff saved").then(close,()=>{});
 if(f.id==="profileForm")call(Centra.put("/api/dashboard/profile",{name:d.get("name"),city:d.get("city"),address:d.get("address")||"",phone:d.get("phone")||"",slug:d.get("slug"),open:d.get("open"),close:d.get("close"),days:d.getAll("days"),areas:d.getAll("area").map(a=>a.trim()).filter(Boolean)}),"Business profile saved");});
$("#bell").addEventListener("click",()=>{state.page="notifications";render()});
$("#sound").addEventListener("click",()=>call(Centra.put("/api/dashboard/settings",{sound:!state.sound}),state.sound?"Sound muted":"Sound enabled"));
function beep(){if(!state.sound)return;try{let C=window.AudioContext||window.webkitAudioContext;if(C){let c=new C(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=660;g.gain.value=.03;o.start();o.stop(c.currentTime+.12)}}catch{}}
let es=null;
function listen(){if(es)es.close();es=new EventSource("/api/dashboard/events?after="+(state.lastNotificationId||0));
 es.addEventListener("notification",ev=>{const n=JSON.parse(ev.data);state.lastNotificationId=Math.max(state.lastNotificationId,n.id);beep();toast(n.title+(n.body?" · "+n.body:""));reload()});
 es.onerror=()=>{es.close();setTimeout(listen,10000)}}
(async function init(){try{const me=await Centra.get("/api/auth/me");state.owner=me.user;$(".ownerlabel").textContent=me.user.name+" · Owner"}catch(e){location.href="/";return}
 await reload();listen()})();

</script></body></html>
